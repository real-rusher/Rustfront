<!DOCTYPE html>
<!--
  DUSTFRONT - Kontoseite

  DIESE DATEI IST DIE VORLAGE. Die fertige Seite ist KONTO.html und wird
  erzeugt:

      python werkzeug_kontoseite.py

  Alles, was die Seite ueber das Spiel weiss - Waffen, Namen der Werte,
  Farben, Schrift, Zugang zum Server -, kommt beim Erzeugen aus
  dustfront/config.py und assets/ und landet unten in DATEN. Hier
  steht es deshalb nirgends noch einmal.

  Aufbau, falls jemand etwas dazubauen will:

    Netz      alles, was mit dem Server redet. Eine Stelle.
    Stand     was gerade bekannt ist. Eine Stelle.
    Schrift   die Pixelschrift des Spiels, auf Leinwand gemalt.
    Bauen     kleine Helfer fuer Kaesten, Knoepfe, Reihen.
    SEITEN    die Reiter. Eine neue Seite ist ein Eintrag hier.

  Eine neue Seite braucht genau einen Eintrag in SEITEN:

      { name: "AUSSEHEN", titel: "AUSSEHEN", bauen: (ziel) => {...} }

  Mehr nicht. Die Leiste, das Umschalten und das Neuzeichnen ergeben
  sich daraus.
-->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUSTFRONT - Konto</title>
<style>
  :root{
    --amber:#e8a33d; --creme:#eee2cb; --matt:#836c52; --matt-dunkel:#544231;
    --grund:#090605; --tafel:#120d0a; --kasten:#1a130e; --linie:#3a2e22;
    --rot:#e2622f; --blau:#3fd2c0;
    --schnitt:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--grund); color:var(--creme);
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
    font-size:13px; line-height:1.55; letter-spacing:.04em;
    -webkit-font-smoothing:none;
    min-height:100vh;
  }
  /* Der Hintergrund des Spiels: Staub, nicht Schwarz. */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(232,163,61,.07), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  }
  .rahmen{position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:22px 16px 64px}

  /* Abgeschnittene Ecken - die Form, die sich durch das ganze Spiel zieht. */
  .kante{
    clip-path:polygon(var(--schnitt) 0, calc(100% - var(--schnitt)) 0, 100% var(--schnitt),
      100% calc(100% - var(--schnitt)), calc(100% - var(--schnitt)) 100%,
      var(--schnitt) 100%, 0 calc(100% - var(--schnitt)), 0 var(--schnitt));
  }
  .tafel{background:var(--tafel); border:1px solid var(--linie); padding:16px; margin-bottom:14px}
  .kasten{background:var(--kasten); border:1px solid var(--linie); padding:12px}

  h1,h2,h3{margin:0; font-weight:normal; letter-spacing:.12em}
  .titel{display:block}
  .unter{color:var(--matt); font-size:12px; letter-spacing:.14em; text-transform:uppercase}
  .matt{color:var(--matt)} .dunkel{color:var(--matt-dunkel)} .amber{color:var(--amber)}
  .creme{color:var(--creme)} .rot{color:var(--rot)} .blau{color:var(--blau)}
  .klein{font-size:11px} .mono{font-variant-numeric:tabular-nums}
  .rechts{text-align:right} .mitte{text-align:center}

  /* Kopf */
  .kopf{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:16px}
  .kopf .wer{margin-left:auto; text-align:right}

  /* Reiter */
  .leiste{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
  .reiter{
    background:var(--kasten); border:1px solid var(--linie); color:var(--matt);
    padding:8px 14px; cursor:pointer; letter-spacing:.12em; font:inherit;
    text-transform:uppercase; font-size:12px;
  }
  .reiter:hover{color:var(--creme); border-color:var(--matt)}
  .reiter[aria-selected="true"]{color:#1a130e; background:var(--amber); border-color:var(--amber)}
  .reiter:disabled{color:#3b2f24; cursor:not-allowed; border-color:#251d16}
  .reiter:disabled:hover{color:#3b2f24; border-color:#251d16}

  /* Knoepfe und Felder */
  button.knopf{
    background:var(--kasten); border:1px solid var(--matt-dunkel); color:var(--creme);
    padding:9px 16px; cursor:pointer; font:inherit; letter-spacing:.12em;
    text-transform:uppercase; font-size:12px;
  }
  button.knopf:hover:not(:disabled){border-color:var(--amber); color:var(--amber)}
  button.knopf.stark{background:var(--amber); border-color:var(--amber); color:#1a130e}
  button.knopf.stark:hover:not(:disabled){background:#f4b455}
  button.knopf:disabled{opacity:.4; cursor:not-allowed}
  input,select{
    background:#0d0907; border:1px solid var(--matt-dunkel); color:var(--creme);
    padding:9px 11px; font:inherit; letter-spacing:.08em; width:100%;
  }
  input:focus,select:focus{outline:none; border-color:var(--amber)}
  label{display:block; color:var(--matt); font-size:11px; letter-spacing:.14em;
        text-transform:uppercase; margin-bottom:5px}
  .feld{margin-bottom:12px}

  /* Gitter */
  .gitter{display:grid; gap:10px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

  /* Wertkachel */
  .wert{background:var(--kasten); border:1px solid var(--linie); padding:11px 13px}
  .wert .zahl{font-size:22px; color:var(--creme); letter-spacing:.02em; line-height:1.2}
  .wert .bez{color:var(--matt); font-size:11px; letter-spacing:.14em; text-transform:uppercase}
  .wert .roh{color:var(--matt-dunkel); font-size:10px; letter-spacing:.06em}
  .wert.neu{border-color:var(--amber)}

  /* Tabelle */
  table{width:100%; border-collapse:collapse; font-size:12px}
  th{color:var(--matt); font-weight:normal; text-align:left; letter-spacing:.14em;
     text-transform:uppercase; font-size:11px; padding:7px 9px;
     border-bottom:1px solid var(--linie)}
  td{padding:7px 9px; border-bottom:1px solid #1e1710}
  tr:hover td{background:#171009}
  .balken{height:4px; background:#241b13; position:relative; overflow:hidden}
  .balken i{position:absolute; inset:0 auto 0 0; background:var(--amber)}

  /* Waffensymbol */
  .symbol{image-rendering:pixelated; height:20px; vertical-align:middle}
  .symbol.gross{height:34px}

  /* Loadout */
  .satz{background:var(--kasten); border:1px solid var(--linie); padding:13px}
  .satz.gewaehlt{border-color:var(--amber)}
  .schlitz{
    display:flex; align-items:center; gap:9px; background:#0d0907;
    border:1px solid var(--linie); padding:7px 9px; margin-bottom:7px; cursor:pointer;
  }
  .schlitz:hover{border-color:var(--matt)}
  .schlitz select{border:none; background:transparent; padding:0; flex:1}

  /* Meldung */
  .meldung{padding:11px 14px; margin-bottom:12px; border:1px solid var(--linie);
           background:var(--kasten); font-size:12px}
  .meldung.gut{border-color:#4a7a3c; color:#b9d9a8}
  .meldung.schlecht{border-color:#8a3b2a; color:#e9a892}
  .meldung.arbeit{border-color:var(--matt-dunkel); color:var(--matt)}

  /* Anmeldung */
  .tor{max-width:400px; margin:6vh auto}
  .tor canvas{display:block; margin:0 auto 6px}

  /* Kosmetik: Regler, Wellen, Zuschnitt, Vorschau */
  input[type=range]{padding:0; border:none; background:transparent; accent-color:var(--amber);
                    height:22px; cursor:pointer}
  input[type=file]{padding:7px; cursor:pointer}
  input[type=checkbox]{width:auto; accent-color:var(--amber); margin:0 6px 0 0; vertical-align:middle}
  .regler{display:grid; grid-template-columns:118px 1fr 78px; align-items:center; gap:10px; margin-bottom:4px}
  .regler label{margin:0}
  .regler .stand{color:var(--creme); font-size:11px; text-align:right; font-variant-numeric:tabular-nums}
  .zeile{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .abstand{margin-top:12px}
  canvas.welle{display:block; width:100%; height:96px; background:#0d0907;
               border:1px solid var(--linie); cursor:ew-resize; touch-action:none}
  canvas.welle.ruhig{height:64px; cursor:default}
  canvas.zuschnitt{display:block; max-width:100%; max-height:200px;
                   border:1px solid var(--linie);
                   background:conic-gradient(#1a130e 25%, #0d0907 0 50%, #1a130e 0 75%, #0d0907 0) 0 0/16px 16px}
  canvas.spielbild{display:block; width:100%; max-width:640px; aspect-ratio:16/9;
                   image-rendering:pixelated; border:1px solid var(--linie); touch-action:none}
  .status{font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin:2px 0 10px}

  .fuss{color:var(--matt-dunkel); font-size:11px; text-align:center; margin-top:30px;
        letter-spacing:.1em; line-height:1.9}
  .fuss a{color:var(--matt)}
  canvas.pixeltext{image-rendering:pixelated; display:block}
  .verborgen{display:none !important}
</style>

// Schrift - die 5x7-Pixelschrift des Spiels
//
// Ueberschriften werden damit auf eine Leinwand gemalt, nicht gesetzt.
// Das ist der Unterschied zwischen "sieht aus wie das Spiel" und "ist
// dieselbe Schrift wie im Spiel". Fliesstext bleibt eine normale
// Schriftart - eine 5x7-Schrift ist zum Lesen von Absaetzen zu grob.
// ══════════════════════════════════════════════════════════════════
const Schrift = {
  zeilen: (() => {
    const z = {};
    for (const [k, v] of Object.entries(DATEN.schrift.zeichen)) z[k] = v.split("/");
    return z;
  })(),
  vorbereiten(text){
    let aus = "";
    for (const c of String(text)){
      const e = DATEN.schrift.ersatz[c];
      aus += e !== undefined ? e : (c.toUpperCase());
    }
    return aus;
  },
  malen(text, skala, farbe){
    const GW = DATEN.schrift.breite, GH = DATEN.schrift.hoehe, luft = 1;
    const t = this.vorbereiten(text);
    const c = document.createElement("canvas");
    c.className = "pixeltext";
    c.width = Math.max(1, t.length * (GW + luft) * skala - luft * skala);
    c.height = GH * skala;
    const g = c.getContext("2d");
    g.fillStyle = farbe;
    for (let i = 0; i < t.length; i++){
      const rows = this.zeilen[t[i]] || this.zeilen["?"];
      if (!rows) continue;
      for (let y = 0; y < rows.length; y++)
        for (let x = 0; x < rows[y].length; x++)
          if (rows[y][x] === "1")
            g.fillRect((i * (GW + luft) + x) * skala, y * skala, skala, skala);
    }
    return c;
  },
};

// ══════════════════════════════════════════════════════════════════
// Netz - alles, was mit dem Server redet, an einer Stelle
//
// Dieselben zwei Wege wie im Spiel (dustfront/ablage.py):
//   /auth/v1/...   Anmeldedienst. Kennwoerter gehen nur hierhin.
//   /rest/v1/...   Die Tabellen. Der Server laesst ueber den
//                  Zeilenschutz nur die eigenen Zeilen durch.
//
// Kein Aufruf wirft. Was schiefgeht, kommt als {ok:false, fehler} -
// genauso wie im Spiel, damit sich beide gleich verhalten.
// ══════════════════════════════════════════════════════════════════
const Netz = {
  get url(){ return (DATEN.server.url || "").replace(/\/+$/, ""); },
  get schluessel(){ return DATEN.server.schluessel || ""; },
  get eingerichtet(){ return !!(this.url && this.schluessel); },

  postfach(name){
    return name.trim().toLowerCase() + "@" + DATEN.server.postfach;
  },

  async rufen(weg, {daten, marke, methode, kopf} = {}){
    if (!this.eingerichtet) return {ok:false, fehler:"KEIN SERVER EINGETRAGEN"};
    const k = {
      "apikey": this.schluessel,
      "Authorization": "Bearer " + (marke || this.schluessel),
      "Accept": "application/json",
      ...(kopf || {}),
    };
    if (daten !== undefined) k["Content-Type"] = "application/json";
    let antwort;
    try{
      antwort = await fetch(this.url + weg, {
        method: methode || (daten !== undefined ? "POST" : "GET"),
        headers: k,
        body: daten !== undefined ? JSON.stringify(daten) : undefined,
      });
    }catch(e){
      return {ok:false, fehler:"SERVER NICHT ERREICHBAR"};
    }
    const roh = await antwort.text();
    let inhalt = null;
    if (roh.trim()){ try{ inhalt = JSON.parse(roh); }catch(e){ inhalt = null; } }
    if (!antwort.ok){
      const grund = (inhalt && (inhalt.msg || inhalt.message ||
                    inhalt.error_description || inhalt.error)) || ("FEHLER " + antwort.status);
      return {ok:false, fehler:String(grund).toUpperCase().slice(0,140)};
    }
    return {ok:true, daten: inhalt === null ? {} : inhalt};
  },

  async anmelden(name, wort){
    const a = await this.rufen("/auth/v1/token?grant_type=password",
      {daten:{email:this.postfach(name), password:wort}});
    return a.ok ? this.sitzungLesen(a.daten, name) : a;
  },

  async anlegen(name, wort){
    const a = await this.rufen("/auth/v1/signup",
      {daten:{email:this.postfach(name), password:wort, data:{name}}});
    return a.ok ? this.sitzungLesen(a.daten, name) : a;
  },

  sitzungLesen(d, name){
    const marke = d && d.access_token;
    const wer = d && d.user && d.user.id;
    if (!marke || !wer) return {ok:false, fehler:"KONTO ANGELEGT, ABER NOCH NICHT BESTÄTIGT"};
    return {ok:true, daten:{
      marke, erneuern: d.refresh_token || "", kennung: wer,
      name: (d.user.user_metadata && d.user.user_metadata.name) || name,
      laeuft_ab: Date.now() + (Number(d.expires_in) || 3600) * 1000,
    }};
  },

  async erneuern(marke){
    const a = await this.rufen("/auth/v1/token?grant_type=refresh_token",
      {daten:{refresh_token:marke}});
    return a.ok ? this.sitzungLesen(a.daten, "") : a;
  },

  async kennwortAendern(marke, wort){
    return this.rufen("/auth/v1/user", {daten:{password:wort}, marke, methode:"PUT"});
  },

  async profilLesen(marke){
    const a = await this.rufen("/rest/v1/profil?select=name,fassung,werte,loadouts&limit=1",
      {marke});
    if (!a.ok) return a;
    const z = Array.isArray(a.daten) && a.daten[0];
    return {ok:true, daten: z
      ? {name:z.name||"", fassung:Number(z.fassung)||0, werte:z.werte||{}, loadouts:z.loadouts||[]}
      : {name:"", fassung:0, werte:{}, loadouts:[]}};
  },

  // Nur schreiben, wenn die Fassung noch stimmt - dieselbe Regel wie im
  // Spiel. Wer eine alte Fassung schickt, trifft keine Zeile und bekommt
  // eine Abfuhr statt eines stillen Ueberschreibens.
  async profilSchreiben(marke, profil){
    const erwartet = Number(profil.fassung) || 0;
    const rumpf = {fassung: erwartet + 1,
                   werte: profil.werte || {}, loadouts: profil.loadouts || []};
    if (profil.name !== undefined) rumpf.name = profil.name;
    const a = await this.rufen("/rest/v1/profil?fassung=eq." + erwartet,
      {daten:rumpf, marke, methode:"PATCH", kopf:{"Prefer":"return=representation"}});
    if (!a.ok) return a;
    const z = Array.isArray(a.daten) && a.daten[0];
    if (!z) return {ok:false, fehler:"PROFIL WURDE ZWISCHENDURCH GEÄNDERT"};
    return {ok:true, daten:{name:z.name||"", fassung:Number(z.fassung),
                            werte:z.werte||{}, loadouts:z.loadouts||[]}};
  },

  // Alle Runden, nicht nur die neuesten 500: seit die Uebersicht aus den
  // Runden rechnet, waere jede fehlende eine fehlende Zahl. Seitenweise,
  // weil Supabase je Anfrage hoechstens 1000 Zeilen schickt.
  async gefechteLesen(marke, hoechstens){
    const seite = 1000, alle = [];
    const grenze = hoechstens || 200000;
    while (alle.length < grenze){
      const a = await this.rufen("/rest/v1/gefecht?select=*&order=gespielt.desc,partie.asc" +
        "&limit=" + seite + "&offset=" + alle.length, {marke});
      if (!a.ok) return alle.length ? {ok:true, daten:alle, unvollstaendig:true} : a;
      const z = Array.isArray(a.daten) ? a.daten : [];
      alle.push(...z);
      if (z.length < seite) break;
    }
    return {ok:true, daten:alle};
  },

  // ---- ADMIN: Funktionen auf dem Server (docs/KONTO.md 5.8) ----------
  // Jede bekommt das Kennwort mit und prueft es selbst. Sie werfen nie,
  // sondern antworten {ok:false, fehler, sekunden} - hier ausgepackt, so
  // dass es aussieht wie jede andere Antwort dieser Seite.
  async rpc(name, argumente){
    const a = await this.rufen("/rest/v1/rpc/" + name, {daten:argumente});
    if (!a.ok){
      if (/PGRST202|COULD NOT FIND THE FUNCTION/.test(a.fehler))
        return {ok:false, fehler:"AUF DEM SERVER FEHLT DAS ADMIN-SQL - SIEHE docs/KONTO.md, ABSCHNITT 5.8"};
      return a;
    }
    const d = a.daten || {};
    if (d.ok === false)
      return {ok:false, fehler:String(d.fehler || "FEHLER"), sekunden:Number(d.sekunden) || 0,
              frei: d.frei === undefined ? null : Number(d.frei)};
    return {ok:true, daten:d};
  },

  // ---- Spielerkosmetik: eine Zeile je Konto (docs/KONTO.md 5.6) ----
  async kosmetikLesen(marke){
    const a = await this.rufen("/rest/v1/kosmetik?select=blend_ton,blend_bild,music_kit&limit=1", {marke});
    if (!a.ok) return a;
    const z = Array.isArray(a.daten) && a.daten[0];
    return {ok:true, daten:{ton: (z && z.blend_ton) || "", bild: (z && z.blend_bild) || "",
                            musicKit: (z && z.music_kit) || ""}};
  },

  // Anlegen oder ueberschreiben in einem: gibt es die Zeile schon, wird
  // sie ersetzt (resolution=merge-duplicates), sonst angelegt.
  async kosmetikSchreiben(marke, kennung, ton, bild, musicKit){
    return this.rufen("/rest/v1/kosmetik?on_conflict=konto", {
      marke, methode:"POST",
      daten:{konto:kennung, blend_ton:ton, blend_bild:bild, music_kit:musicKit,
             geaendert:new Date().toISOString()},
      kopf:{"Prefer":"resolution=merge-duplicates,return=minimal"}});
  },

  async kosmetikLoeschen(marke, kennung){
    return this.rufen("/rest/v1/kosmetik?konto=eq." + encodeURIComponent(kennung),
      {marke, methode:"DELETE"});
  },
};

// ══════════════════════════════════════════════════════════════════
// Stand - was gerade bekannt ist
// ══════════════════════════════════════════════════════════════════
const SCHLUESSEL = "dustfront.konto.sitzung";
const Stand = {
  sitzung:null, profil:null, gefechte:[], seite:"UEBERSICHT", meldung:null,
  // version: null = alle, "" = vor 0.31, sonst die Fassung.
  filter:{version:null, art:"", abgebrochene:false},
  // Die Loadouts in Arbeit, bis SPEICHERN. Ohne diesen Entwurf baute
  // jede Auswahl die Seite neu - aus dem gespeicherten Profil -, und die
  // eben gewaehlte Waffe sprang sofort zurueck (gemeldet in 0.29).
  entwurf:null,

  laden(){
    try{
      const roh = localStorage.getItem(SCHLUESSEL);
      if (roh) this.sitzung = JSON.parse(roh);
    }catch(e){ this.sitzung = null; }
  },
  // Der ADMIN: {wort, muss_aendern, konten, alle, seite}, oder null. Das
  // Kennwort steht nur hier, im Speicher dieser offenen Seite - nie im
  // Browser gespeichert. Wer neu laedt, meldet sich neu an.
  admin:null,

  sichern(){
    // Ein vom ADMIN geoeffnetes Konto ist keine Anmeldung. Gespeichert,
    // stuende es nach dem Neuladen als angemeldeter Spieler da - ohne
    // Marke, und ueber der eigenen Sitzung, falls es eine gab.
    if (this.sitzung && this.sitzung.admin) return;
    try{
      if (this.sitzung) localStorage.setItem(SCHLUESSEL, JSON.stringify(this.sitzung));
      else localStorage.removeItem(SCHLUESSEL);
    }catch(e){ /* privates Fenster: dann eben nur fuer diesen Besuch */ }
  },
  abmelden(){
    if (this.admin){ return adminZurListe(); }
    this.sitzung = null; this.profil = null; this.gefechte = []; this.entwurf = null;
    this.seite = "UEBERSICHT"; this.sichern();
    // Die Kosmetik gehoert zum Konto: wer sich als jemand anderes
    // anmeldet, soll nicht die des Vorigen weiterbearbeiten.
    werkstattLeeren();
    zeichnen();
  },
};

// ══════════════════════════════════════════════════════════════════
// Ziel - wohin Profil, Runden und Kosmetik gehen
//
// Das eigene Konto, oder - beim ADMIN - das Konto, das er gerade offen
// hat. Alle Reiter (AUSRUESTUNG, KOSMETIK, die Zahlen) bleiben dieselben;
// nur dieser eine Ort entscheidet, ueber welchen Weg gelesen und
// geschrieben wird. So sieht der ADMIN ein Konto genau so, wie sein
// Spieler es sieht, und es gibt keine zweite Fassung jeder Seite.
// ══════════════════════════════════════════════════════════════════
const Ziel = {
  get admin(){ return !!(Stand.admin && Stand.sitzung && Stand.sitzung.admin); },

  async profilLesen(){
    if (!this.admin) return Netz.profilLesen(Stand.sitzung.marke);
    const a = await Admin.rufen("admin_profil", {konto:Stand.sitzung.kennung});
    return a.ok ? {ok:true, daten:a.daten.profil} : a;
  },
  async profilSchreiben(profil){
    if (!this.admin) return Netz.profilSchreiben(Stand.sitzung.marke, profil);
    const a = await Admin.rufen("admin_profil_schreiben", {
      konto:Stand.sitzung.kennung, fassung:Number(profil.fassung) || 0,
      name:profil.name || "", werte:profil.werte || {}, loadouts:profil.loadouts || []});
    return a.ok ? {ok:true, daten:a.daten.profil} : a;
  },
  async gefechteLesen(){
    if (!this.admin) return Netz.gefechteLesen(Stand.sitzung.marke);
    return Admin.gefechte(Stand.sitzung.kennung);
  },
  async kosmetikLesen(){
    if (!this.admin) return mitSitzung((m) => Netz.kosmetikLesen(m));
    const a = await Admin.rufen("admin_kosmetik", {konto:Stand.sitzung.kennung});
    return a.ok ? {ok:true, daten:{ton:a.daten.ton || "", bild:a.daten.bild || "",
                                   musicKit:a.daten.music_kit || ""}} : a;
  },
  async kosmetikSchreiben(ton, bild, musicKit){
    const kennung = Stand.sitzung.kennung;
    if (this.admin)
      return Admin.rufen("admin_kosmetik_schreiben", {konto:kennung, ton:ton || "", bild:bild || "",
                                                       music_kit:musicKit || ""});
    return (ton || bild || musicKit)
      ? mitSitzung((m) => Netz.kosmetikSchreiben(m, kennung, ton, bild, musicKit))
      : mitSitzung((m) => Netz.kosmetikLoeschen(m, kennung));
  },
};

// ══════════════════════════════════════════════════════════════════
// Admin - das Konto, das alle anderen sieht (docs/KONTO.md 5.8)
// ══════════════════════════════════════════════════════════════════
const Admin = {
  // Jeder Aufruf mit dem Kennwort. Kommt FALSCH oder GESPERRT zurueck,
  // hat jemand das Kennwort geaendert oder es wird gerade geraten - dann
  // ist diese Anmeldung vorbei.
  async rufen(name, argumente){
    const a = await Netz.rpc(name, Object.assign({wort:Stand.admin ? Stand.admin.wort : ""},
                                                  argumente || {}));
    if (!a.ok && (a.fehler === "FALSCH" || a.fehler === "GESPERRT") && Stand.admin){
      adminAbmelden(sperrText(a));
    }
    return a;
  },

  // Seitenweise wie Netz.gefechteLesen; ohne Konto die aller Spieler.
  async gefechte(konto){
    const seite = 1000, alle = [];
    while (alle.length < 200000){
      const a = await this.rufen("admin_gefechte",
        {konto:konto || null, ab:alle.length, anzahl:seite});
      if (!a.ok) return alle.length ? {ok:true, daten:alle, unvollstaendig:true} : a;
      const z = Array.isArray(a.daten.gefechte) ? a.daten.gefechte : [];
      alle.push(...z);
      if (z.length < seite) break;
    }
    return {ok:true, daten:alle};
  },

  nameVon(kennung){
    const k = Stand.admin && (Stand.admin.konten || []).find(x => x.konto === kennung);
    return k ? (k.name || k.anmeldename) : String(kennung || "?").slice(0, 8) + "…";
  },
};

function dauerText(sekunden){
  const s = Math.max(0, Math.ceil(Number(sekunden) || 0));
  const t = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60), r = s % 60;
  if (t) return t + " TAG" + (t > 1 ? "E" : "") + " " + h + " H";
  if (h) return h + " H " + m + " MIN";
  if (m) return m + " MIN" + (r ? " " + r + " S" : "");
  return r + " S";
}

// Was eine Abfuhr beim Anmelden heisst, in einem Satz.
function sperrText(a){
  if (a.fehler === "GESPERRT")
    return "ZU VIELE FEHLVERSUCHE - GESPERRT, NOCH " + dauerText(a.sekunden);
  if (a.fehler === "FALSCH"){
    if (a.sekunden > 0) return "KENNWORT FALSCH - GESPERRT FÜR " + dauerText(a.sekunden);
    if (a.frei === 1) return "KENNWORT FALSCH - NOCH EIN FEHLVERSUCH OHNE SPERRE";
    return "KENNWORT FALSCH - DER NÄCHSTE FEHLVERSUCH SPERRT";
  }
  return a.fehler;
}

// Bauen - kleine Helfer. Kein Rahmenwerk, nur Funktionen.

function el(art, klasse, text){
  const e = document.createElement(art);
  if (klasse) e.className = klasse;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function anhaengen(ziel, ...kinder){ for (const k of kinder) if (k) ziel.appendChild(k); return ziel; }

function ueberschrift(text, skala, farbe){
  const h = el("div", "titel");
  h.appendChild(Schrift.malen(text, skala || 3, farbe || DATEN.farben.amber));
  return h;
}

function tafel(titel){
  const t = el("div", "tafel kante");
  if (titel){
    const kopf = el("div");
    kopf.style.marginBottom = "12px";
    kopf.appendChild(Schrift.malen(titel, 2, DATEN.farben.amber));
    t.appendChild(kopf);
  }
  return t;
}

function wertkachel(name, zahl, roh){
  const k = el("div", "wert kante");
  const z = el("div", "zahl mono", zahl);
  if (String(zahl).length > 11) z.style.fontSize = "15px";
  else if (String(zahl).length > 8) z.style.fontSize = "18px";
  anhaengen(k, z, el("div", "bez", name));
  if (roh) k.appendChild(el("div", "roh", roh));
  return k;
}

function knopf(text, klasse, tun){
  const b = el("button", "knopf kante" + (klasse ? " " + klasse : ""), text);
  if (tun) b.addEventListener("click", tun);
  return b;
}

function feld(bezeichnung, art, wert, attr){
  const h = el("div", "feld");
  h.appendChild(el("label", null, bezeichnung));
  const i = el("input");
  i.type = art; i.value = wert || "";
  Object.assign(i, attr || {});
  h.appendChild(i);
  h.eingabe = i;
  return h;
}

function meldung(text, art){
  Stand.meldung = text ? {text, art: art || "arbeit"} : null;
}

function waffenbild(schluessel, gross){
  const w = DATEN.waffen[schluessel];
  if (!w) return null;
  const i = el("img", "symbol" + (gross ? " gross" : ""));
  i.src = w.bild; i.alt = w.name; i.title = w.name;
  return i;
}

// Zahlen so anschreiben, wie ein Mensch sie liest. Sekunden und Meter
// stehen roh in der Datenbank; hier bekommen sie ihre Einheit.
function zahlText(schluessel, wert){
  const n = Number(wert) || 0;
  if (schluessel === "spielzeit" || schluessel === "zonenzeit"){
    const s = Math.round(n);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    if (h) return h + " H " + String(m).padStart(2, "0") + " MIN";
    if (m) return m + " MIN " + String(s % 60).padStart(2, "0") + " S";
    return s + " S";
  }
  if (schluessel === "strecke"){
    // Das Spiel rechnet in Pixeln; 32 Pixel sind eine Kachel.
    return Math.round(n / 32).toLocaleString("de-DE") + " KACHELN";
  }
  if (!Number.isInteger(n)) return n.toFixed(1);
  return n.toLocaleString("de-DE");
}

// ══════════════════════════════════════════════════════════════════
// Auswertung - die Zahlen aus den Runden, nicht aus dem Profil
//
// Bis 0.30 las die Seite UEBERSICHT und WERTE aus profil.werte. Dort
// stehen aber die Einstellungen (Bildschirmruckeln, Aufloesung, ...),
// keine Zaehler - die Kacheln zeigten darum Nullen. Gerechnet wird jetzt
// wie im Spiel (konto.py, Journal.summe): jede Runde ist eine Zeile in
// `gefecht`, und die Summe ist die Summe dieser Zeilen.
//
// Seit 0.31 mit drei Filtern, die ueberall gelten:
//   VERSION   nur die Runden einer Fassung des Spiels. Nach einer
//             Aenderung am Gleichgewicht (Zombies mit weniger Leben)
//             sind die Zahlen davor und danach nicht dieselben.
//   ART       PVP, PVE oder PVPVE (K.MODUS_ART im Spiel).
//   ABGEBROCHENE  sonst nicht mitgezaehlt - eine Runde, die nach einer
//             Minute endete, hat wenige Abschuesse und zaehlt nicht als
//             Runde; "Abschuesse je Runde" stimmte sonst nicht mehr.
// ══════════════════════════════════════════════════════════════════
const Auswertung = {
  abgebrochen(g){
    // Dieselbe Regel wie Journal.abgebrochen: die Spalte "ende", oder -
    // fuer Zeilen, die ein Server ohne die Spalten von 0.31 angenommen
    // hat - der Zaehler in den Werten.
    if (String(g.ende || "") === "abgebrochen") return true;
    return (Number((g.werte || {}).abgebrochen) || 0) > 0;
  },

  art(g){ return (DATEN.modus_art || {})[g.modus] || ""; },

  // Ohne Version heisst: gespielt vor 0.31. Eine eigene Wahl im Filter,
  // statt sie still unter "alle" zu verstecken.
  version(g){ return String(g.version || ""); },

  versionen(gefechte){
    const zahl = (v) => v.split(".").map(t => Number(t) || 0);
    const alle = [...new Set(gefechte.map(g => this.version(g)))];
    return alle.sort((a, b) => {
      if (!a) return 1; if (!b) return -1;
      const x = zahl(a), y = zahl(b);
      for (let i = 0; i < Math.max(x.length, y.length); i++){
        if ((x[i] || 0) !== (y[i] || 0)) return (y[i] || 0) - (x[i] || 0);
      }
      return 0;
    });
  },

  // Version und Art. Abgebrochene bleiben drin - wie viele es waren,
  // soll man auch dann sehen, wenn sie nicht mitzaehlen.
  passend(gefechte, f){
    return gefechte.filter(g =>
      (f.version === null || f.version === undefined || this.version(g) === f.version) &&
      (!f.art || this.art(g) === f.art));
  },

  zaehlend(gefechte, f){
    const p = this.passend(gefechte, f);
    return f.abgebrochene ? p : p.filter(g => !this.abgebrochen(g));
  },

  summe(gefechte, f){
    const passend = this.passend(gefechte, f);
    const zeilen = f.abgebrochene ? passend : passend.filter(g => !this.abgebrochen(g));
    const werte = {};
    for (const d of DATEN.werte) werte[d.schluessel] = 0;
    const fremd = {};
    for (const g of zeilen){
      for (const [k, v] of Object.entries(g.werte || {})){
        const n = Number(v) || 0;
        const d = DATEN.werte.find(x => x.schluessel === k);
        if (!d){ fremd[k] = (fremd[k] || 0) + n; continue; }
        werte[k] = d.art === "bestes" ? Math.max(werte[k], n) : werte[k] + n;
      }
    }
    werte.abgebrochen = passend.filter(g => this.abgebrochen(g)).length;
    return {werte, fremd, zeilen, passend};
  },

  waffen(zeilen){
    const summe = {};
    for (const g of zeilen){
      for (const [waffe, werte] of Object.entries(g.waffen || {})){
        const s = summe[waffe] || (summe[waffe] = {});
        for (const [k, v] of Object.entries(werte || {}))
          s[k] = (s[k] || 0) + (Number(v) || 0);
      }
    }
    return summe;
  },

  // Wen wie oft erledigt. Nach Konto, wenn es eines gibt - so bleibt es
  // derselbe Gegner, auch wenn er seinen Namen aendert; angezeigt wird
  // der zuletzt gesehene Name. Ohne Konto (Gast ohne Anmeldung) nach Name.
  opfer(zeilen){
    const je = new Map();
    const neueste = [...zeilen].sort((a, b) => (Number(a.gespielt) || 0) - (Number(b.gespielt) || 0));
    for (const g of neueste){
      for (const o of (Array.isArray(g.opfer) ? g.opfer : [])){
        const schluessel = o.konto ? "k:" + o.konto : "n:" + String(o.name || "?");
        const e = je.get(schluessel) || {name:"?", konto:o.konto || "", anzahl:0};
        e.name = String(o.name || e.name);
        e.anzahl += Number(o.anzahl) || 0;
        je.set(schluessel, e);
      }
    }
    return [...je.values()].sort((a, b) => b.anzahl - a.anzahl || a.name.localeCompare(b.name));
  },
};

// Der Filter steht in Stand.filter und gilt auf allen Reitern mit Zahlen.
function filterLeiste(gefechte){
  const f = Stand.filter;
  const t = el("div", "zeile filter");
  t.style.marginBottom = "12px";

  const ver = el("select");
  ver.style.width = "auto";
  const optionen = [["*", "ALLE VERSIONEN"]];
  for (const v of Auswertung.versionen(gefechte))
    optionen.push([v, v ? "VERSION " + v : "VOR 0.31 (OHNE VERSION)"]);
  for (const [wert, text] of optionen){
    const o = el("option", null, text); o.value = wert; ver.appendChild(o);
  }
  const gewaehlt = (f.version === null || f.version === undefined) ? "*" : f.version;
  // Eine Version, die es in diesen Runden nicht gibt (anderes Konto beim
  // ADMIN), faellt auf "alle" zurueck - sonst stuende ueberall null.
  if (!optionen.some(o => o[0] === gewaehlt)) f.version = null;
  ver.value = (f.version === null) ? "*" : f.version;
  ver.addEventListener("change", () => {
    Stand.filter.version = ver.value === "*" ? null : ver.value; zeichnen();
  });

  const art = el("select");
  art.style.width = "auto";
  for (const [wert, text] of [["", "ALLE ARTEN"], ["pvp", "NUR PVP"], ["pve", "NUR PVE"],
                              ["pvpve", "NUR PVPVE"]]){
    const o = el("option", null, text); o.value = wert; art.appendChild(o);
  }
  art.value = f.art || "";
  art.addEventListener("change", () => { Stand.filter.art = art.value; zeichnen(); });

  const lab = el("label");
  lab.style.margin = "0";
  lab.style.cursor = "pointer";
  const box = el("input"); box.type = "checkbox"; box.checked = !!f.abgebrochene;
  box.addEventListener("change", () => { Stand.filter.abgebrochene = box.checked; zeichnen(); });
  anhaengen(lab, box, document.createTextNode("ABGEBROCHENE MITZÄHLEN"));

  anhaengen(t, ver, art, lab);
  return t;
}

// ---- Uebersicht ---------------------------------------------------
function seiteUebersicht(ziel){
  uebersichtBauen(ziel, Stand.gefechte);
  ziel.appendChild(wasMitlaeuft());
}

function quoteText(treffer, schuesse){
  return ((Number(schuesse) || 0) ? 100 * (Number(treffer) || 0) / Number(schuesse) : 0)
    .toFixed(1) + " %";
}

// Gebaut fuer eine beliebige Menge Runden: die eigenen, oder (ADMIN) die
// aller Konten zusammen.
function uebersichtBauen(ziel, gefechte){
  ziel.appendChild(filterLeiste(gefechte));
  const {werte: w, zeilen} = Auswertung.summe(gefechte, Stand.filter);
  const t = tafel("AUF EINEN BLICK");
  const g = el("div", "gitter g4");
  const wichtig = ["abschuesse","tode","runden","siege","spielzeit","serie",
                   "gegner_abschuesse","abgebrochen"];
  for (const s of wichtig){
    const d = DATEN.werte.find(v => v.schluessel === s);
    if (d) g.appendChild(wertkachel(d.name, zahlText(s, w[s]), null));
  }
  // Verhaeltnis und Trefferquoten rechnet die Seite aus - sie stehen
  // nirgends gespeichert, und das soll auch so bleiben: abgeleitete
  // Zahlen in der Datenbank laufen frueher oder spaeter auseinander.
  const kd = (Number(w.tode) || 0) ? (Number(w.abschuesse)||0) / Number(w.tode) : (Number(w.abschuesse)||0);
  g.appendChild(wertkachel("VERHÄLTNIS", kd.toFixed(2), "abschüsse / tode"));
  const jeRunde = (Number(w.runden) || 0) ? (Number(w.abschuesse) || 0) / Number(w.runden) : 0;
  g.appendChild(wertkachel("ABSCHÜSSE JE RUNDE", jeRunde.toFixed(2), "abschüsse / runden"));
  g.appendChild(wertkachel("TREFFERQUOTE", quoteText(w.treffer, w.schuesse), "treffer / schüsse"));
  g.appendChild(wertkachel("QUOTE PVP", quoteText(w.treffer_pvp, w.schuesse_pvp),
    "treffer_pvp / schuesse_pvp"));
  g.appendChild(wertkachel("QUOTE PVE", quoteText(w.treffer_pve, w.schuesse_pve),
    "treffer_pve / schuesse_pve"));
  t.appendChild(g);
  t.appendChild(el("div", "klein dunkel abstand",
    zeilen.length + " Runden gezählt" + (Stand.filter.abgebrochene
      ? " (abgebrochene eingeschlossen)." : ", abgebrochene nicht.")));
  ziel.appendChild(t);
}

function wasMitlaeuft(){

  const t2 = tafel("WAS MITLÄUFT");
  const p = el("div", "klein matt");
  p.innerHTML =
    "Alles, was DUSTFRONT über dich speichert, steht auf dieser Seite - " +
    "nicht eine Auswahl davon, sondern alles. Unter <b class='creme'>WERTE</b> " +
    "steht jeder einzelne Zähler mit seinem Namen in der Datenbank, unter " +
    "<b class='creme'>RUNDEN</b> jede gespielte Runde einzeln, unter " +
    "<b class='creme'>KOSMETIK</b> dein Ton und dein Bild fuer die Blendgranate. " +
    "Was <b>nicht</b> gespeichert wird: keine Adresse, kein echter Name, " +
    "keine Aufzeichnung davon, wann du spielst und mit wem, nichts vom " +
    "Rechner. Der Name, mit dem du dich anmeldest, wird zu einer Adresse " +
    "auf einer Domäne, die es nicht gibt (" + DATEN.server.postfach + ") - " +
    "es gibt also gar keine, an die jemand schreiben könnte.";
  t2.appendChild(p);
  const reihe = el("div");
  reihe.style.marginTop = "14px";
  reihe.appendChild(knopf("ALLES HERUNTERLADEN", null, herunterladen));

}

async function herunterladen(){
  // Die Kosmetik gehoert dazu - "alles" heisst alles. Sie wird erst
  // geholt, wenn jemand den Reiter oder diesen Knopf benutzt.
  if (!Werkstatt.server.geladen) await kosmetikLaden();
  const alles = {
    gezogen: new Date().toISOString(),
    konto: {name: Stand.sitzung.name, kennung: Stand.sitzung.kennung},
    profil: Stand.profil,
    gefechte: Stand.gefechte,
    kosmetik: {blend_ton: Werkstatt.server.ton, blend_bild: Werkstatt.server.bild,
               music_kit: Werkstatt.server.musicKit},
  };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(alles, null, 2)],
    {type:"application/json"}));
  a.download = "dustfront-" + (Stand.sitzung.name || "konto").toLowerCase() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---- Werte --------------------------------------------------------
function seiteWerte(ziel){
  werteBauen(ziel, Stand.gefechte, (Stand.profil && Stand.profil.werte) || {});
}

function werteBauen(ziel, gefechte, einstellungen){
  ziel.appendChild(filterLeiste(gefechte));
  const {werte: w, fremd} = Auswertung.summe(gefechte, Stand.filter);
  const t = tafel("JEDER ZÄHLER");
  t.appendChild(el("div", "klein matt",
    "Links der Name, den das Spiel benutzt, klein darunter der Name in der " +
    "Datenbank. Was das Spiel noch nicht kennt, steht unten unter SONST NOCH."));
  const g = el("div", "gitter g3");
  g.style.marginTop = "12px";
  const bekannt = new Set();
  for (const v of DATEN.werte){
    bekannt.add(v.schluessel);
    g.appendChild(wertkachel(v.name, zahlText(v.schluessel, w[v.schluessel]),
      v.schluessel + (v.art === "bestes" ? "  (bestes)" : "")));
  }
  t.appendChild(g);
  ziel.appendChild(t);

  // Alles, was sonst noch gespeichert ist. Das ist der eigentliche
  // Punkt an "transparent": nicht nur die Zaehler zeigen, die man
  // kennt, sondern auch die, die spaeter dazukommen - und die

  const t2 = tafel("SONST NOCH");

function rohTabelle(paare){

// ---- Waffen -------------------------------------------------------
function seiteWaffen(ziel){ waffenBauen(ziel, Stand.gefechte); }

function waffenBauen(ziel, gefechte){
  // Je Waffe zaehlt das Spiel Schuesse, Treffer und Abschuesse. Die
  // Zahlen liegen in den Runden, nicht im Profil - also hier addiert.
  ziel.appendChild(filterLeiste(gefechte));
  const zeilen = Auswertung.zaehlend(gefechte, Stand.filter);
  const summe = Auswertung.waffen(zeilen);
  const t = tafel("JE WAFFE");
  if (!zeilen.length){
    t.appendChild(el("div", "klein matt",
      "Noch keine Runde gespielt - darum auch noch keine Zahlen je Waffe."));
    ziel.appendChild(t);
    return;
  }
  t.appendChild(el("div", "klein matt",
    "Addiert aus " + zeilen.length + " Runden. Die Quote ist " +
    "Treffer durch Schüsse."));
  const tab = el("table");
  tab.style.marginTop = "10px";
  const kopf = el("tr");
  anhaengen(kopf, el("th", null, ""), el("th", null, "WAFFE"));
  for (const s of DATEN.waffenwerte) anhaengen(kopf, el("th", "rechts", s.toUpperCase()));
  anhaengen(kopf, el("th", "rechts", "QUOTE"), el("th", null, "ANTEIL"));
  anhaengen(tab, anhaengen(el("thead"), kopf));
  const koerper = el("tbody");
  const reihen = Object.entries(summe).sort(
    (a, b) => (b[1].abschuesse || 0) - (a[1].abschuesse || 0));
  const meiste = Math.max(1, ...reihen.map(r => r[1].abschuesse || 0));
  for (const [waffe, s] of reihen){
    const r = el("tr");
    const bildzelle = el("td");
    const b = waffenbild(waffe, false);
    if (b) bildzelle.appendChild(b);
    anhaengen(r, bildzelle,
      el("td", "creme", (DATEN.waffen[waffe] || {}).name || waffe));
    for (const k of DATEN.waffenwerte)
      anhaengen(r, el("td", "rechts mono", (s[k] || 0).toLocaleString("de-DE")));
    const q = (s.schuesse || 0) ? 100 * (s.treffer || 0) / s.schuesse : 0;
    anhaengen(r, el("td", "rechts mono matt", q.toFixed(1) + " %"));
    // Ein Balken in eigener Spalte: man sieht auf einen Blick, womit
    // wirklich gespielt wird, ohne Zahlen zu vergleichen. Als Zeile
    // darunter sah er aus wie eine Trennlinie.
    const bz = el("td");
    bz.style.width = "140px";
    const bal = el("div", "balken");
    const inner = el("i");
    inner.style.width = (100 * (s.abschuesse || 0) / meiste) + "%";
    bal.appendChild(inner);
    bz.appendChild(bal);
    r.appendChild(bz);
    koerper.appendChild(r);
  }
  tab.appendChild(koerper);
  t.appendChild(tab);
  ziel.appendChild(t);
}

// ---- Runden -------------------------------------------------------
const RUNDEN_ZEIGEN = 400;     // mehr Zeilen macht der Browser, aber niemand liest sie

function seiteRunden(ziel){ rundenBauen(ziel, Stand.gefechte, false); }

function rundenBauen(ziel, gefechte, mitKonto){
  ziel.appendChild(filterLeiste(gefechte));
  const zeilen = Auswertung.zaehlend(gefechte, Stand.filter);
  const t = tafel("JEDE RUNDE");
  if (!zeilen.length){
    t.appendChild(el("div", "klein matt", gefechte.length
      ? "Keine Runde passt zum Filter." : "Noch keine Runde gespielt."));
    ziel.appendChild(t);
    return;
  }
  const versteckt = Auswertung.passend(gefechte, Stand.filter).length - zeilen.length;
  t.appendChild(el("div", "klein matt",
    zeilen.length + " Runden, neueste zuerst" +
    (zeilen.length > RUNDEN_ZEIGEN ? " (die neuesten " + RUNDEN_ZEIGEN + " stehen hier)" : "") +
    ". Jede Zeile ist eine Zeile in der Tabelle gefecht - mehr steht dort nicht." +
    (versteckt ? " " + versteckt + " abgebrochene ausgeblendet." : "")));
  const tab = el("table");
  tab.style.marginTop = "10px";
  const kopf = el("tr");
  const spalten = ["WANN", ...(mitKonto ? ["KONTO"] : []), "ART", "VERSION", "ENDE",
                   "SEITE", "AUSGANG", "ABSCHÜSSE", "TODE", "SCHADEN"];
  for (const s of spalten)
    anhaengen(kopf, el("th", ["WANN","KONTO","ART","VERSION","ENDE"].includes(s) ? null : "rechts", s));
  anhaengen(tab, anhaengen(el("thead"), kopf));
  const koerper = el("tbody");
  for (const g of zeilen.slice(0, RUNDEN_ZEIGEN)){
    const w = g.werte || {};
    const r = el("tr");
    const wann = new Date((Number(g.gespielt) || 0) * 1000);
    r.appendChild(el("td", "matt", isNaN(wann) ? "-" : wann.toLocaleString("de-DE")));
    if (mitKonto) r.appendChild(el("td", "creme", Admin.nameVon(g.konto)));
    anhaengen(r,
      el("td", null, (DATEN.modi[g.modus] || g.modus || "-")));
    if (DATEN.modi_hinweis && DATEN.modi_hinweis[g.modus])
      r.lastChild.title = DATEN.modi_hinweis[g.modus];
    const abbruch = Auswertung.abgebrochen(g);
    anhaengen(r, el("td", "dunkel", Auswertung.version(g) || "-"),
      el("td", abbruch ? "rot" : "matt", abbruch ? "ABGEBROCHEN" : "REGULÄR"));
    const seite = el("td", "rechts");
    if (g.team === 0 || g.team === 1){
      const s = DATEN.teams[g.team];
      seite.textContent = s.name;
      seite.style.color = s.farbe;
    }else seite.textContent = "-";
    r.appendChild(seite);
    const aus = el("td", "rechts");
    aus.textContent = abbruch ? "-" : g.gewonnen === true ? "SIEG"
      : g.gewonnen === false ? "NIEDERLAGE" : "-";
    aus.className = "rechts " + (g.gewonnen === true ? "amber" : "matt");
    r.appendChild(aus);
    for (const k of ["abschuesse","tode","schaden"])
      anhaengen(r, el("td", "rechts mono", (Number(w[k]) || 0).toLocaleString("de-DE")));
    koerper.appendChild(r);
  }
  tab.appendChild(koerper);
  t.appendChild(tab);
  ziel.appendChild(t);
}

// ---- Ausruestung --------------------------------------------------
function seiteAusruestung(ziel){
  const L = DATEN.loadout;
  const t = tafel("AUSRÜSTUNG");
  t.appendChild(el("div", "klein matt",
    "Ein Loadout ist " + L.waffen + " Waffen und " + L.wuerfe + " Wurfwaffe. " +
    "Das Brecheisen steht nicht darin - es liegt auf F und ist immer da. " +
    "Ob die Loadouts in einer Runde überhaupt gelten, entscheidet der " +
    "Gastgeber."));

  if (!Stand.entwurf) Stand.entwurf = holeLoadouts();
  const saetze = Stand.entwurf;
  const geaendert = JSON.stringify(saetze) !== JSON.stringify(holeLoadouts());
  const g = el("div", "gitter g3");
  g.style.marginTop = "12px";
  const gewaehlt = Number((Stand.profil.werte || {}).loadout_gewaehlt) || 0;

  saetze.forEach((satz, i) => {
    const k = el("div", "satz kante" + (i === gewaehlt ? " gewaehlt" : ""));
    const namensfeld = el("input");
    namensfeld.value = satz.name || ("SATZ " + (i + 1));
    namensfeld.maxLength = L.namenslaenge;
    namensfeld.style.marginBottom = "9px";
    namensfeld.addEventListener("input", () => { satz.name = namensfeld.value.toUpperCase(); });
    k.appendChild(namensfeld);

    const schlitz = (liste, stelle, auswahl) => {
      const z = el("div", "schlitz");
      const bild = waffenbild(liste[stelle], false);
      if (bild) z.appendChild(bild);
      const s = el("select");
      for (const w of auswahl){
        const o = el("option", null, (DATEN.waffen[w] || {}).name || w);
        o.value = w;
        if (w === liste[stelle]) o.selected = true;
        s.appendChild(o);
      }
      s.addEventListener("change", () => { liste[stelle] = s.value; zeichnen(); });
      z.appendChild(s);
      return z;
    };
    for (let j = 0; j < L.waffen; j++) k.appendChild(schlitz(satz.waffen, j, L.auswahl_waffen));
    for (let j = 0; j < L.wuerfe; j++) k.appendChild(schlitz(satz.wuerfe, j, L.auswahl_wuerfe));

    const fuss = el("div");
    fuss.style.marginTop = "9px";
    if (i === gewaehlt){
      fuss.appendChild(el("div", "klein amber", "GETRAGEN"));
    }else{
      fuss.appendChild(knopf("TRAGEN", null, () => {
        Stand.profil.werte = Object.assign({}, Stand.profil.werte,
          {loadout_gewaehlt: i});
        sichernProfil();
      }));
    }
    k.appendChild(fuss);
    g.appendChild(k);
  });
  t.appendChild(g);

  const reihe = el("div");
  reihe.style.marginTop = "14px";
  reihe.appendChild(knopf("SPEICHERN", "stark", async () => {
    const vorher = Stand.profil.loadouts;
    Stand.profil.loadouts = JSON.parse(JSON.stringify(saetze));
    if (await sichernProfil()) Stand.entwurf = null;     // jetzt gilt das Gespeicherte
    else Stand.profil.loadouts = vorher;                  // der Entwurf bleibt
    zeichnen();
  }));
  if (geaendert){
    const hinweis = el("span", "klein amber", "  GEÄNDERT - NOCH NICHT GESPEICHERT");
    hinweis.style.marginLeft = "12px";
    reihe.appendChild(hinweis);
  }
  t.appendChild(reihe);
  ziel.appendChild(t);
}

// Immer so viele Saetze, wie K.LOADOUT vorsieht - fehlende werden aus
// den Vorlagen aufgefuellt. So steht die Maske nie halb leer da, und
// was gespeichert wird, passt zu dem, was das Spiel erwartet.
function holeLoadouts(){
  const L = DATEN.loadout;
  const da = Array.isArray(Stand.profil.loadouts) ? Stand.profil.loadouts : [];
  const aus = [];
  for (let i = 0; i < L.plaetze; i++){
    const v = L.vorlagen[i % L.vorlagen.length];
    const s = da[i] || {};
    const waffen = [], wuerfe = [];
    for (let j = 0; j < L.waffen; j++){
      const w = (s.waffen || [])[j];
      waffen.push(L.auswahl_waffen.includes(w) ? w : v.waffen[j % v.waffen.length]);
    }
    for (let j = 0; j < L.wuerfe; j++){
      const w = (s.wuerfe || [])[j];
      wuerfe.push(L.auswahl_wuerfe.includes(w) ? w : v.wuerfe[j % v.wuerfe.length]);
    }
    aus.push({name: String(s.name || v.name).toUpperCase().slice(0, L.namenslaenge),
              waffen, wuerfe});
  }
  return aus;
}
