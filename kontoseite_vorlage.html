<!DOCTYPE html>
<!--
  DUSTFRONT - Kontoseite

  DIESE DATEI IST DIE VORLAGE. Die fertige Seite ist KONTO.html und wird
  erzeugt:

      python werkzeug_kontoseite.py

  Alles, was die Seite ueber das Spiel weiss - Waffen, Namen der Werte,
  Farben, Schrift, Zugang zum Server -, kommt beim Erzeugen aus
  dustfront/config.py und assets/ und landet unten in DATEN. Hier
  steht es deshalb nirgends noch einmal.

  Aufbau, falls jemand etwas dazubauen will:

    Netz      alles, was mit dem Server redet. Eine Stelle.
    Stand     was gerade bekannt ist. Eine Stelle.
    Schrift   die Pixelschrift des Spiels, auf Leinwand gemalt.
    Bauen     kleine Helfer fuer Kaesten, Knoepfe, Reihen.
    SEITEN    die Reiter. Eine neue Seite ist ein Eintrag hier.

  Eine neue Seite braucht genau einen Eintrag in SEITEN:

      { name: "AUSSEHEN", titel: "AUSSEHEN", bauen: (ziel) => {...} }

  Mehr nicht. Die Leiste, das Umschalten und das Neuzeichnen ergeben
  sich daraus.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUSTFRONT - Konto</title>
<style>
  :root{
    --amber:#e8a33d; --creme:#eee2cb; --matt:#836c52; --matt-dunkel:#544231;
    --grund:#090605; --tafel:#120d0a; --kasten:#1a130e; --linie:#3a2e22;
    --rot:#e2622f; --blau:#3fd2c0;
    --schnitt:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--grund); color:var(--creme);
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
    font-size:13px; line-height:1.55; letter-spacing:.04em;
    -webkit-font-smoothing:none;
    min-height:100vh;
  }
  /* Der Hintergrund des Spiels: Staub, nicht Schwarz. */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(232,163,61,.07), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  }
  .rahmen{position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:22px 16px 64px}

  /* Abgeschnittene Ecken - die Form, die sich durch das ganze Spiel zieht. */
  .kante{
    clip-path:polygon(var(--schnitt) 0, calc(100% - var(--schnitt)) 0, 100% var(--schnitt),
      100% calc(100% - var(--schnitt)), calc(100% - var(--schnitt)) 100%,
      var(--schnitt) 100%, 0 calc(100% - var(--schnitt)), 0 var(--schnitt));
  }
  .tafel{background:var(--tafel); border:1px solid var(--linie); padding:16px; margin-bottom:14px}
  .kasten{background:var(--kasten); border:1px solid var(--linie); padding:12px}

  h1,h2,h3{margin:0; font-weight:normal; letter-spacing:.12em}
  .titel{display:block}
  .unter{color:var(--matt); font-size:12px; letter-spacing:.14em; text-transform:uppercase}
  .matt{color:var(--matt)} .dunkel{color:var(--matt-dunkel)} .amber{color:var(--amber)}
  .creme{color:var(--creme)} .rot{color:var(--rot)} .blau{color:var(--blau)}
  .klein{font-size:11px} .mono{font-variant-numeric:tabular-nums}
  .rechts{text-align:right} .mitte{text-align:center}

  /* Kopf */
  .kopf{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:16px}
  .kopf .wer{margin-left:auto; text-align:right}

  /* Reiter */
  .leiste{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
  .reiter{
    background:var(--kasten); border:1px solid var(--linie); color:var(--matt);
    padding:8px 14px; cursor:pointer; letter-spacing:.12em; font:inherit;
    text-transform:uppercase; font-size:12px;
  }
  .reiter:hover{color:var(--creme); border-color:var(--matt)}
  .reiter[aria-selected="true"]{color:#1a130e; background:var(--amber); border-color:var(--amber)}
  .reiter:disabled{color:#3b2f24; cursor:not-allowed; border-color:#251d16}
  .reiter:disabled:hover{color:#3b2f24; border-color:#251d16}

  /* Knoepfe und Felder */
  button.knopf{
    background:var(--kasten); border:1px solid var(--matt-dunkel); color:var(--creme);
    padding:9px 16px; cursor:pointer; font:inherit; letter-spacing:.12em;
    text-transform:uppercase; font-size:12px;
  }
  button.knopf:hover:not(:disabled){border-color:var(--amber); color:var(--amber)}
  button.knopf.stark{background:var(--amber); border-color:var(--amber); color:#1a130e}
  button.knopf.stark:hover:not(:disabled){background:#f4b455}
  button.knopf:disabled{opacity:.4; cursor:not-allowed}
  input,select{
    background:#0d0907; border:1px solid var(--matt-dunkel); color:var(--creme);
    padding:9px 11px; font:inherit; letter-spacing:.08em; width:100%;
  }
  input:focus,select:focus{outline:none; border-color:var(--amber)}
  label{display:block; color:var(--matt); font-size:11px; letter-spacing:.14em;
        text-transform:uppercase; margin-bottom:5px}
  .feld{margin-bottom:12px}

  /* Gitter */
  .gitter{display:grid; gap:10px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

  /* Wertkachel */
  .wert{background:var(--kasten); border:1px solid var(--linie); padding:11px 13px}
  .wert .zahl{font-size:22px; color:var(--creme); letter-spacing:.02em; line-height:1.2}
  .wert .bez{color:var(--matt); font-size:11px; letter-spacing:.14em; text-transform:uppercase}
  .wert .roh{color:var(--matt-dunkel); font-size:10px; letter-spacing:.06em}
  .wert.neu{border-color:var(--amber)}

  /* Tabelle */
  table{width:100%; border-collapse:collapse; font-size:12px}
  th{color:var(--matt); font-weight:normal; text-align:left; letter-spacing:.14em;
     text-transform:uppercase; font-size:11px; padding:7px 9px;
     border-bottom:1px solid var(--linie)}
  td{padding:7px 9px; border-bottom:1px solid #1e1710}
  tr:hover td{background:#171009}
  .balken{height:4px; background:#241b13; position:relative; overflow:hidden}
  .balken i{position:absolute; inset:0 auto 0 0; background:var(--amber)}

  /* Waffensymbol */
  .symbol{image-rendering:pixelated; height:20px; vertical-align:middle}
  .symbol.gross{height:34px}

  /* Loadout */
  .satz{background:var(--kasten); border:1px solid var(--linie); padding:13px}
  .satz.gewaehlt{border-color:var(--amber)}
  .schlitz{
    display:flex; align-items:center; gap:9px; background:#0d0907;
    border:1px solid var(--linie); padding:7px 9px; margin-bottom:7px; cursor:pointer;
  }
  .schlitz:hover{border-color:var(--matt)}
  .schlitz select{border:none; background:transparent; padding:0; flex:1}

  /* Meldung */
  .meldung{padding:11px 14px; margin-bottom:12px; border:1px solid var(--linie);
           background:var(--kasten); font-size:12px}
  .meldung.gut{border-color:#4a7a3c; color:#b9d9a8}
  .meldung.schlecht{border-color:#8a3b2a; color:#e9a892}
  .meldung.arbeit{border-color:var(--matt-dunkel); color:var(--matt)}

  /* Anmeldung */
  .tor{max-width:400px; margin:6vh auto}
  .tor canvas{display:block; margin:0 auto 6px}

  /* Kosmetik: Regler, Wellen, Zuschnitt, Vorschau */
  input[type=range]{padding:0; border:none; background:transparent; accent-color:var(--amber);
                    height:22px; cursor:pointer}
  input[type=file]{padding:7px; cursor:pointer}
  input[type=checkbox]{width:auto; accent-color:var(--amber); margin:0 6px 0 0; vertical-align:middle}
  .regler{display:grid; grid-template-columns:118px 1fr 78px; align-items:center; gap:10px; margin-bottom:4px}
  .regler label{margin:0}
  .regler .stand{color:var(--creme); font-size:11px; text-align:right; font-variant-numeric:tabular-nums}
  .zeile{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .abstand{margin-top:12px}
  canvas.welle{display:block; width:100%; height:96px; background:#0d0907;
               border:1px solid var(--linie); cursor:ew-resize; touch-action:none}
  canvas.welle.ruhig{height:64px; cursor:default}
  canvas.zuschnitt{display:block; max-width:100%; max-height:200px;
                   border:1px solid var(--linie);
                   background:conic-gradient(#1a130e 25%, #0d0907 0 50%, #1a130e 0 75%, #0d0907 0) 0 0/16px 16px}
  canvas.spielbild{display:block; width:100%; max-width:640px; aspect-ratio:16/9;
                   image-rendering:pixelated; border:1px solid var(--linie); touch-action:none}
  .status{font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin:2px 0 10px}

  .fuss{color:var(--matt-dunkel); font-size:11px; text-align:center; margin-top:30px;
        letter-spacing:.1em; line-height:1.9}
  .fuss a{color:var(--matt)}
  canvas.pixeltext{image-rendering:pixelated; display:block}
  .verborgen{display:none !important}
</style>
</head>
<body>
<div class="rahmen" id="rahmen"></div>

<script>
"use strict";

// ══════════════════════════════════════════════════════════════════
// Was die Seite ueber DUSTFRONT weiss. Erzeugt, nicht getippt.
// ══════════════════════════════════════════════════════════════════
const DATEN =
/*DATEN*/
;

// ══════════════════════════════════════════════════════════════════
// Schrift - die 5x7-Pixelschrift des Spiels
//
// Ueberschriften werden damit auf eine Leinwand gemalt, nicht gesetzt.
// Das ist der Unterschied zwischen "sieht aus wie das Spiel" und "ist
// dieselbe Schrift wie im Spiel". Fliesstext bleibt eine normale
// Schriftart - eine 5x7-Schrift ist zum Lesen von Absaetzen zu grob.
// ══════════════════════════════════════════════════════════════════
const Schrift = {
  zeilen: (() => {
    const z = {};
    for (const [k, v] of Object.entries(DATEN.schrift.zeichen)) z[k] = v.split("/");
    return z;
  })(),
  vorbereiten(text){
    let aus = "";
    for (const c of String(text)){
      const e = DATEN.schrift.ersatz[c];
      aus += e !== undefined ? e : (c.toUpperCase());
    }
    return aus;
  },
  malen(text, skala, farbe){
    const GW = DATEN.schrift.breite, GH = DATEN.schrift.hoehe, luft = 1;
    const t = this.vorbereiten(text);
    const c = document.createElement("canvas");
    c.className = "pixeltext";
    c.width = Math.max(1, t.length * (GW + luft) * skala - luft * skala);
    c.height = GH * skala;
    const g = c.getContext("2d");
    g.fillStyle = farbe;
    for (let i = 0; i < t.length; i++){
      const rows = this.zeilen[t[i]] || this.zeilen["?"];
      if (!rows) continue;
      for (let y = 0; y < rows.length; y++)
        for (let x = 0; x < rows[y].length; x++)
          if (rows[y][x] === "1")
            g.fillRect((i * (GW + luft) + x) * skala, y * skala, skala, skala);
    }
    return c;
  },
};

// ══════════════════════════════════════════════════════════════════
// Netz - alles, was mit dem Server redet, an einer Stelle
//
// Dieselben zwei Wege wie im Spiel (dustfront/ablage.py):
//   /auth/v1/...   Anmeldedienst. Kennwoerter gehen nur hierhin.
//   /rest/v1/...   Die Tabellen. Der Server laesst ueber den
//                  Zeilenschutz nur die eigenen Zeilen durch.
//
// Kein Aufruf wirft. Was schiefgeht, kommt als {ok:false, fehler} -
// genauso wie im Spiel, damit sich beide gleich verhalten.
// ══════════════════════════════════════════════════════════════════
const Netz = {
  get url(){ return (DATEN.server.url || "").replace(/\/+$/, ""); },
  get schluessel(){ return DATEN.server.schluessel || ""; },
  get eingerichtet(){ return !!(this.url && this.schluessel); },

  postfach(name){
    return name.trim().toLowerCase() + "@" + DATEN.server.postfach;
  },

  async rufen(weg, {daten, marke, methode, kopf} = {}){
    if (!this.eingerichtet) return {ok:false, fehler:"KEIN SERVER EINGETRAGEN"};
    const k = {
      "apikey": this.schluessel,
      "Authorization": "Bearer " + (marke || this.schluessel),
      "Accept": "application/json",
      ...(kopf || {}),
    };
    if (daten !== undefined) k["Content-Type"] = "application/json";
    let antwort;
    try{
      antwort = await fetch(this.url + weg, {
        method: methode || (daten !== undefined ? "POST" : "GET"),
        headers: k,
        body: daten !== undefined ? JSON.stringify(daten) : undefined,
      });
    }catch(e){
      return {ok:false, fehler:"SERVER NICHT ERREICHBAR"};
    }
    const roh = await antwort.text();
    let inhalt = null;
    if (roh.trim()){ try{ inhalt = JSON.parse(roh); }catch(e){ inhalt = null; } }
    if (!antwort.ok){
      const grund = (inhalt && (inhalt.msg || inhalt.message ||
                    inhalt.error_description || inhalt.error)) || ("FEHLER " + antwort.status);
      return {ok:false, fehler:String(grund).toUpperCase().slice(0,140)};
    }
    return {ok:true, daten: inhalt === null ? {} : inhalt};
  },

  async anmelden(name, wort){
    const a = await this.rufen("/auth/v1/token?grant_type=password",
      {daten:{email:this.postfach(name), password:wort}});
    return a.ok ? this.sitzungLesen(a.daten, name) : a;
  },

  async anlegen(name, wort){
    const a = await this.rufen("/auth/v1/signup",
      {daten:{email:this.postfach(name), password:wort, data:{name}}});
    return a.ok ? this.sitzungLesen(a.daten, name) : a;
  },

  sitzungLesen(d, name){
    const marke = d && d.access_token;
    const wer = d && d.user && d.user.id;
    if (!marke || !wer) return {ok:false, fehler:"KONTO ANGELEGT, ABER NOCH NICHT BESTAETIGT"};
    return {ok:true, daten:{
      marke, erneuern: d.refresh_token || "", kennung: wer,
      name: (d.user.user_metadata && d.user.user_metadata.name) || name,
      laeuft_ab: Date.now() + (Number(d.expires_in) || 3600) * 1000,
    }};
  },

  async erneuern(marke){
    const a = await this.rufen("/auth/v1/token?grant_type=refresh_token",
      {daten:{refresh_token:marke}});
    return a.ok ? this.sitzungLesen(a.daten, "") : a;
  },

  async kennwortAendern(marke, wort){
    return this.rufen("/auth/v1/user", {daten:{password:wort}, marke, methode:"PUT"});
  },

  async profilLesen(marke){
    const a = await this.rufen("/rest/v1/profil?select=name,fassung,werte,loadouts&limit=1",
      {marke});
    if (!a.ok) return a;
    const z = Array.isArray(a.daten) && a.daten[0];
    return {ok:true, daten: z
      ? {name:z.name||"", fassung:Number(z.fassung)||0, werte:z.werte||{}, loadouts:z.loadouts||[]}
      : {name:"", fassung:0, werte:{}, loadouts:[]}};
  },

  // Nur schreiben, wenn die Fassung noch stimmt - dieselbe Regel wie im
  // Spiel. Wer eine alte Fassung schickt, trifft keine Zeile und bekommt
  // eine Abfuhr statt eines stillen Ueberschreibens.
  async profilSchreiben(marke, profil){
    const erwartet = Number(profil.fassung) || 0;
    const rumpf = {fassung: erwartet + 1,
                   werte: profil.werte || {}, loadouts: profil.loadouts || []};
    if (profil.name !== undefined) rumpf.name = profil.name;
    const a = await this.rufen("/rest/v1/profil?fassung=eq." + erwartet,
      {daten:rumpf, marke, methode:"PATCH", kopf:{"Prefer":"return=representation"}});
    if (!a.ok) return a;
    const z = Array.isArray(a.daten) && a.daten[0];
    if (!z) return {ok:false, fehler:"PROFIL WURDE ZWISCHENDURCH GEAENDERT"};
    return {ok:true, daten:{name:z.name||"", fassung:Number(z.fassung),
                            werte:z.werte||{}, loadouts:z.loadouts||[]}};
  },

  async gefechteLesen(marke, hoechstens){
    const a = await this.rufen("/rest/v1/gefecht?select=*&order=gespielt.desc&limit=" +
      (hoechstens || 500), {marke});
    if (!a.ok) return a;
    return {ok:true, daten: Array.isArray(a.daten) ? a.daten : []};
  },

  // ---- Spielerkosmetik: eine Zeile je Konto (docs/KONTO.md 5.6) ----
  async kosmetikLesen(marke){
    const a = await this.rufen("/rest/v1/kosmetik?select=blend_ton,blend_bild&limit=1", {marke});
    if (!a.ok) return a;
    const z = Array.isArray(a.daten) && a.daten[0];
    return {ok:true, daten:{ton: (z && z.blend_ton) || "", bild: (z && z.blend_bild) || ""}};
  },

  // Anlegen oder ueberschreiben in einem: gibt es die Zeile schon, wird
  // sie ersetzt (resolution=merge-duplicates), sonst angelegt.
  async kosmetikSchreiben(marke, kennung, ton, bild){
    return this.rufen("/rest/v1/kosmetik?on_conflict=konto", {
      marke, methode:"POST",
      daten:{konto:kennung, blend_ton:ton, blend_bild:bild,
             geaendert:new Date().toISOString()},
      kopf:{"Prefer":"resolution=merge-duplicates,return=minimal"}});
  },

  async kosmetikLoeschen(marke, kennung){
    return this.rufen("/rest/v1/kosmetik?konto=eq." + encodeURIComponent(kennung),
      {marke, methode:"DELETE"});
  },
};

// ══════════════════════════════════════════════════════════════════
// Stand - was gerade bekannt ist
// ══════════════════════════════════════════════════════════════════
const SCHLUESSEL = "dustfront.konto.sitzung";
const Stand = {
  sitzung:null, profil:null, gefechte:[], seite:"UEBERSICHT", meldung:null,
  // Die Loadouts in Arbeit, bis SPEICHERN. Ohne diesen Entwurf baute
  // jede Auswahl die Seite neu - aus dem gespeicherten Profil -, und die
  // eben gewaehlte Waffe sprang sofort zurueck (gemeldet in 0.29).
  entwurf:null,

  laden(){
    try{
      const roh = localStorage.getItem(SCHLUESSEL);
      if (roh) this.sitzung = JSON.parse(roh);
    }catch(e){ this.sitzung = null; }
  },
  sichern(){
    try{
      if (this.sitzung) localStorage.setItem(SCHLUESSEL, JSON.stringify(this.sitzung));
      else localStorage.removeItem(SCHLUESSEL);
    }catch(e){ /* privates Fenster: dann eben nur fuer diesen Besuch */ }
  },
  abmelden(){
    this.sitzung = null; this.profil = null; this.gefechte = []; this.entwurf = null;
    this.seite = "UEBERSICHT"; this.sichern();
    // Die Kosmetik gehoert zum Konto: wer sich als jemand anderes
    // anmeldet, soll nicht die des Vorigen weiterbearbeiten.
    werkstattLeeren();
    zeichnen();
  },
};

// ══════════════════════════════════════════════════════════════════
// Bauen - kleine Helfer. Kein Rahmenwerk, nur Funktionen.
// ══════════════════════════════════════════════════════════════════
function el(art, klasse, text){
  const e = document.createElement(art);
  if (klasse) e.className = klasse;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function anhaengen(ziel, ...kinder){ for (const k of kinder) if (k) ziel.appendChild(k); return ziel; }

function ueberschrift(text, skala, farbe){
  const h = el("div", "titel");
  h.appendChild(Schrift.malen(text, skala || 3, farbe || DATEN.farben.amber));
  return h;
}

function tafel(titel){
  const t = el("div", "tafel kante");
  if (titel){
    const kopf = el("div");
    kopf.style.marginBottom = "12px";
    kopf.appendChild(Schrift.malen(titel, 2, DATEN.farben.amber));
    t.appendChild(kopf);
  }
  return t;
}

function wertkachel(name, zahl, roh){
  const k = el("div", "wert kante");
  const z = el("div", "zahl mono", zahl);
  if (String(zahl).length > 11) z.style.fontSize = "15px";
  else if (String(zahl).length > 8) z.style.fontSize = "18px";
  anhaengen(k, z, el("div", "bez", name));
  if (roh) k.appendChild(el("div", "roh", roh));
  return k;
}

function knopf(text, klasse, tun){
  const b = el("button", "knopf kante" + (klasse ? " " + klasse : ""), text);
  if (tun) b.addEventListener("click", tun);
  return b;
}

function feld(bezeichnung, art, wert, attr){
  const h = el("div", "feld");
  h.appendChild(el("label", null, bezeichnung));
  const i = el("input");
  i.type = art; i.value = wert || "";
  Object.assign(i, attr || {});
  h.appendChild(i);
  h.eingabe = i;
  return h;
}

function meldung(text, art){
  Stand.meldung = text ? {text, art: art || "arbeit"} : null;
}

function waffenbild(schluessel, gross){
  const w = DATEN.waffen[schluessel];
  if (!w) return null;
  const i = el("img", "symbol" + (gross ? " gross" : ""));
  i.src = w.bild; i.alt = w.name; i.title = w.name;
  return i;
}

// Zahlen so anschreiben, wie ein Mensch sie liest. Sekunden und Meter
// stehen roh in der Datenbank; hier bekommen sie ihre Einheit.
function zahlText(schluessel, wert){
  const n = Number(wert) || 0;
  if (schluessel === "spielzeit" || schluessel === "zonenzeit"){
    const s = Math.round(n);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    if (h) return h + " H " + String(m).padStart(2, "0") + " MIN";
    if (m) return m + " MIN " + String(s % 60).padStart(2, "0") + " S";
    return s + " S";
  }
  if (schluessel === "strecke"){
    // Das Spiel rechnet in Pixeln; 32 Pixel sind eine Kachel.
    return Math.round(n / 32).toLocaleString("de-DE") + " KACHELN";
  }
  if (!Number.isInteger(n)) return n.toFixed(1);
  return n.toLocaleString("de-DE");
}

  const summe = {};
  for (const g of Stand.gefechte){
    const wf = g.waffen || {};
    for (const [waffe, werte] of Object.entries(wf)){
      const s = summe[waffe] || (summe[waffe] = {});

    return;
  }
  t.appendChild(el("div", "klein matt",
    "Addiert aus allen " + Stand.gefechte.length + " Runden. Die Quote ist " +
    "Treffer durch Schuesse."));

  tab.style.marginTop = "10px";
  const kopf = el("tr");
  anhaengen(kopf, el("th", null, ""), el("th", null, "WAFFE"));

  anhaengen(tab, anhaengen(el("thead"), kopf));
  const koerper = el("tbody");
  const reihen = Object.entries(summe).sort(
    (a, b) => (b[1].abschuesse || 0) - (a[1].abschuesse || 0));
  const meiste = Math.max(1, ...reihen.map(r => r[1].abschuesse || 0));
  for (const [waffe, s] of reihen){
    const r = el("tr");
    const bildzelle = el("td");
    const b = waffenbild(waffe, false);
    if (b) bildzelle.appendChild(b);
    anhaengen(r, bildzelle,
      el("td", "creme", (DATEN.waffen[waffe] || {}).name || waffe));

      anhaengen(r, el("td", "rechts mono", (s[k] || 0).toLocaleString("de-DE")));

    bal.appendChild(inner);
    bz.appendChild(bal);
    r.appendChild(bz);
    koerper.appendChild(r);

}

// Immer so viele Saetze, wie K.LOADOUT vorsieht - fehlende werden aus
// den Vorlagen aufgefuellt. So steht die Maske nie halb leer da, und
// was gespeichert wird, passt zu dem, was das Spiel erwartet.
function holeLoadouts(){
  const L = DATEN.loadout;
  const da = Array.isArray(Stand.profil.loadouts) ? Stand.profil.loadouts : [];
  const aus = [];
  for (let i = 0; i < L.plaetze; i++){
    const v = L.vorlagen[i % L.vorlagen.length];
    const s = da[i] || {};
    const waffen = [], wuerfe = [];
    for (let j = 0; j < L.waffen; j++){
      const w = (s.waffen || [])[j];
      waffen.push(L.auswahl_waffen.includes(w) ? w : v.waffen[j % v.waffen.length]);
    }
    for (let j = 0; j < L.wuerfe; j++){
      const w = (s.wuerfe || [])[j];
      wuerfe.push(L.auswahl_wuerfe.includes(w) ? w : v.wuerfe[j % v.wuerfe.length]);
    }
    aus.push({name: String(s.name || v.name).toUpperCase().slice(0, L.namenslaenge),
              waffen, wuerfe});
  }
  return aus;
}

// Werkstatt - die Spielerkosmetik (Reiter KOSMETIK)
//
// Ein eigener Ton und ein eigenes Bild fuer die Blendgranate. Wer eine
// wirft, klingt nach seinem Ton, und im Weiss der Blendung steht sein
// Bild - bei allen Mitspielern, wenn der Gastgeber mit Kosmetik startet
// (dustfront/spielerkosmetik.py).
//
// Der Weg eines Tons:
//
//   Datei (MP3, WAV, OGG)  -> zuschneiden -> Bass -> lauter (weich
//   uebersteuert) -> klassischer Knall und Pfeifen dazu -> eigenes
//   Abklingen -> 22050 Hz, 16 Bit, mono
//
// Das ist der Ton, der hochgeladen wird. Das Spiel legt danach seine
// Grenze darueber: er wird immer leiser, und am Ende ist er still. Die
// Seite rechnet dieselbe Grenze fuer die Vorschau nach (tonAusklingen) -
// Schritt fuer Schritt wie im Spiel, damit man hier hoert, was man dort
// hoert. Hochgeladen wird trotzdem der Ton davor: verbindlich ist, was
// das Spiel rechnet, nicht was eine Seite behauptet.
//
// Der Zustand steht hier und nicht im DOM: zeichnen() baut die Seite bei
// jeder Meldung neu, und eine geladene Datei soll das ueberleben.
// ══════════════════════════════════════════════════════════════════
const KOS = DATEN.kosmetik;

const Werkstatt = {
  server: null,        // was auf dem Server liegt, siehe werkstattLeeren
  ton: null,           // der Ton in Arbeit, siehe tonUebernehmen
  tonWeg: false,       // den gespeicherten Ton beim Speichern entfernen
  bild: null,          // das Bild in Arbeit, siehe bildUebernehmen
  bildWeg: false,
  klassisch: {},       // AudioBuffer der Klaenge aus dem Spiel
  dom: {},             // die Leinwaende der gerade gebauten Seite
  _ctx: null, _laeuft: null, _rechnen: 0, _takt: 0, _blitz: 0,
};

function werkstattLeeren(){
  tonStoppen();
  Werkstatt.server = {geladen:false, laedt:false, fehler:"", ton:"", bild:"",
                      tonFertig:null, bildFlaeche:null, bildLage:null};
  Werkstatt.ton = null; Werkstatt.tonWeg = false;
  Werkstatt.bild = null; Werkstatt.bildWeg = false;
}

// ---- Bytes --------------------------------------------------------
function zuBase64(bytes){
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000)
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function ausBase64(text){
  const s = atob(text), b = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return b;
}

// WAV, 16 Bit mono - genau das, was spielerkosmetik.ton_lesen annimmt.
function wavSchreiben(proben, rate){
  const n = proben.length, d = new DataView(new ArrayBuffer(44 + 2 * n));
  const text = (o, s) => { for (let i = 0; i < s.length; i++) d.setUint8(o + i, s.charCodeAt(i)); };
  text(0, "RIFF"); d.setUint32(4, 36 + 2 * n, true); text(8, "WAVE");
  text(12, "fmt "); d.setUint32(16, 16, true); d.setUint16(20, 1, true);
  d.setUint16(22, 1, true); d.setUint32(24, rate, true); d.setUint32(28, rate * 2, true);
  d.setUint16(32, 2, true); d.setUint16(34, 16, true);
  text(36, "data"); d.setUint32(40, 2 * n, true);
  for (let i = 0; i < n; i++) d.setInt16(44 + 2 * i, proben[i], true);
  return new Uint8Array(d.buffer);
}

// Liest eine WAV wie das Spiel: 16 Bit, eine oder zwei Spuren, zwei
// werden gemittelt (abgerundet, wie // in Python). Null, wenn nicht.
function wavLesen(bytes){
  if (bytes.length < 12) return null;
  const d = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const kennung = (o) => String.fromCharCode(d.getUint8(o), d.getUint8(o + 1),
                                             d.getUint8(o + 2), d.getUint8(o + 3));
  if (kennung(0) !== "RIFF" || kennung(8) !== "WAVE") return null;
  let o = 12, spuren = 0, rate = 0, breite = 0, anfang = -1, laenge = 0;
  while (o + 8 <= bytes.length){
    const art = kennung(o), groesse = d.getUint32(o + 4, true);
    if (art === "fmt " && o + 24 <= bytes.length){
      spuren = d.getUint16(o + 10, true); rate = d.getUint32(o + 12, true);
      breite = d.getUint16(o + 22, true);
    }else if (art === "data"){
      anfang = o + 8; laenge = Math.min(groesse, bytes.length - anfang); break;
    }
    o += 8 + groesse + (groesse % 2);
  }
  if (anfang < 0 || breite !== 16 || (spuren !== 1 && spuren !== 2)) return null;
  const n = Math.floor(laenge / 2 / spuren), proben = new Int16Array(n);
  for (let i = 0; i < n; i++){
    proben[i] = spuren === 1 ? d.getInt16(anfang + 2 * i, true)
      : Math.floor((d.getInt16(anfang + 4 * i, true) + d.getInt16(anfang + 4 * i + 2, true)) / 2);
  }
  return {rate, proben};
}

// ---- Die Grenze des Spiels ----------------------------------------
// Genau spielerkosmetik.ton_ausklingen, Zeile fuer Zeile. Gleiche
// Rechenschritte in gleicher Reihenfolge geben in beiden Sprachen
// dieselben Zahlen - tests/kontoseite_browser.py prueft das Probe fuer
// Probe. Wer eines aendert, aendert das andere mit.
function tonAusklingen(proben, rate){
  const n = proben.length;
  const breite = Math.max(1, Math.trunc(rate * KOS.ton_abschnitt));
  const anzahl = Math.floor((n + breite - 1) / breite);
  const spitzen = [];
  for (let a = 0; a < anzahl; a++){
    let s = 0;
    const bis = Math.min(n, (a + 1) * breite);
    for (let i = a * breite; i < bis; i++) s = Math.max(s, Math.abs(proben[i]));
    spitzen.push(s);
  }
  const anlauf = Math.max(1, Math.round(KOS.ton_anlauf / KOS.ton_abschnitt));
  const ausklangAb = Math.trunc(n * (1.0 - KOS.ton_ausklang));
  const rest = Math.max(1, n - ausklangAb);
  const oben = Math.max(0, ...spitzen.slice(0, anlauf));
  let erlaubt = oben;
  const gaenge = [];
  for (let a = 0; a < anzahl; a++){
    const spitze = spitzen[a];
    if (a < anlauf){ gaenge.push(1.0); continue; }
    const ende = Math.min(n, (a + 1) * breite);
    const linie = oben * Math.max(0.0, Math.min(1.0, 1.0 - (ende - ausklangAb) / rest));
    erlaubt = Math.min(erlaubt, linie);
    if (a === anzahl - 1) erlaubt = 0.0;
    const g = spitze > 0 ? Math.min(1.0, erlaubt / spitze) : 1.0;
    gaenge.push(g);
    erlaubt = Math.min(erlaubt, Math.max(spitze * g, erlaubt * KOS.ton_abfall));
  }
  const kanten = [gaenge.length ? gaenge[0] : 1.0];
  for (let a = 1; a < anzahl; a++) kanten.push(Math.min(gaenge[a - 1], gaenge[a]));
  kanten.push(gaenge.length ? gaenge[gaenge.length - 1] : 1.0);
  const aus = new Int16Array(n);
  for (let i = 0; i < n; i++){
    const a = Math.floor(i / breite);
    const g = kanten[a] + (kanten[a + 1] - kanten[a]) * ((i % breite) / breite);
    aus[i] = Math.max(-32768, Math.min(32767, Math.trunc(proben[i] * g)));
  }
  return {proben:aus, oben, anlauf, breite};
}

// ---- Klang --------------------------------------------------------
function audioKontext(){
  if (!Werkstatt._ctx){
    const AK = window.AudioContext || window.webkitAudioContext;
    if (!AK) return null;
    Werkstatt._ctx = new AK();
  }
  if (Werkstatt._ctx.state === "suspended") Werkstatt._ctx.resume();
  return Werkstatt._ctx;
}

function pufferAus(proben, rate){
  const b = new AudioBuffer({length:Math.max(1, proben.length), sampleRate:rate,
                             numberOfChannels:1});
  const f = new Float32Array(Math.max(1, proben.length));
  for (let i = 0; i < proben.length; i++) f[i] = proben[i] / 32768;
  b.copyToChannel(f, 0);
  return b;
}

// Knall und Pfeifen aus dem Spiel, beim ersten Gebrauch ausgepackt.
function klassisch(art){
  if (!Werkstatt.klassisch[art] && DATEN.klassisch && DATEN.klassisch[art]){
    const w = wavLesen(ausBase64(DATEN.klassisch[art].split(",")[1]));
    if (w) Werkstatt.klassisch[art] = pufferAus(w.proben, w.rate);
  }
  return Werkstatt.klassisch[art] || null;
}

function tonSpielen(t){
  const ctx = audioKontext();
  if (!ctx || !t) return;
  tonStoppen();
  const s = ctx.createBufferSource();
  s.buffer = pufferAus(t.proben, t.rate);
  s.connect(ctx.destination);
  s.start();
  Werkstatt._laeuft = s;
  s.onended = () => { if (Werkstatt._laeuft === s) Werkstatt._laeuft = null; };
}
function tonStoppen(){
  if (Werkstatt._laeuft){ try{ Werkstatt._laeuft.stop(); }catch(e){} }
  Werkstatt._laeuft = null;
}

// Was gerade gilt: der Ton in Arbeit, sonst der gespeicherte - beide so,
// wie das Spiel sie spielen wird.
function aktuellerTon(){
  const T = Werkstatt.ton;
  if (T) return T.fertig ? {proben:T.fertig.proben, rate:KOS.rate} : null;
  return Werkstatt.tonWeg ? null : Werkstatt.server.tonFertig;
}

// Die Kurve fuer "lauter": tanh, also weich uebersteuert statt hart
// abgeschnitten. Ein Formglied bildet nur -1..1 ab und schneidet alles
// darueber ab - darum geht das Signal um VORHALT leiser hinein, und die
// Kurve rechnet es wieder hoch. So bleibt bis +42 dB alles weich.
const VORHALT = 128;
let _saettigung = null;
function saettigung(){
  if (!_saettigung){
    const n = 65536;
    _saettigung = new Float32Array(n);
    for (let i = 0; i < n; i++) _saettigung[i] = Math.tanh(VORHALT * (2 * i / (n - 1) - 1));
  }
  return _saettigung;
}

async function tonDatei(datei){
  if (!datei) return;
  if (datei.size > 40 * 1024 * 1024)
    return sageUndZeichne("DIE DATEI IST ZU GROSS - HOECHSTENS 40 MB", "schlecht");
  const ctx = audioKontext();
  if (!ctx || typeof OfflineAudioContext === "undefined")
    return sageUndZeichne("DIESER BROWSER KANN KEINEN TON BEARBEITEN", "schlecht");
  sageUndZeichne("LESE " + datei.name.toUpperCase() + "...", "arbeit");
  let puffer;
  try{ puffer = await ctx.decodeAudioData(await datei.arrayBuffer()); }
  catch(e){ return sageUndZeichne("DIESE DATEI LAESST SICH NICHT LESEN - MP3, WAV ODER OGG", "schlecht"); }
  tonUebernehmen(puffer, datei.name);
}

// Der klassische Knall mit Pfeifen als Ausgangspunkt - fuer alle, die
// keine eigene Datei haben und nur den Bass drehen wollen.
function klassischAlsGrundlage(){
  const k = klassisch("knall"), p = klassisch("pfeifen");
  if (!k || !p) return sageUndZeichne("DIE KLAENGE AUS DEM SPIEL FEHLEN IN DIESER SEITE", "schlecht");
  const rate = k.sampleRate;
  const n = Math.max(k.length, p.length, Math.ceil(rate * KOS.ton_min));
  const b = new AudioBuffer({length:n, sampleRate:rate, numberOfChannels:1});
  const f = new Float32Array(n), kk = k.getChannelData(0), pp = p.getChannelData(0);
  for (let i = 0; i < n; i++) f[i] = (i < kk.length ? kk[i] : 0) + (i < pp.length ? 0.6 * pp[i] : 0);
  b.copyToChannel(f, 0);
  tonUebernehmen(b, "KLASSISCH");
}

function tonUebernehmen(puffer, name){
  if (puffer.duration < KOS.ton_min)
    return sageUndZeichne("DER TON IST ZU KURZ - MINDESTENS " + KOS.ton_min.toFixed(1) + " S", "schlecht");
  // Die Regler bleiben, wie sie waren: wer eine zweite Datei probiert,
  // will sie meist genauso klingen lassen.
  const alt = Werkstatt.ton || {bass:0, laut:0, knall:0, pfeifen:0, abklingen:0};
  Werkstatt.ton = {quelle:puffer, name:String(name).toUpperCase(),
    start:0, ende:Math.min(puffer.duration, KOS.ton_max),
    bass:alt.bass, laut:alt.laut, knall:alt.knall, pfeifen:alt.pfeifen,
    abklingen:alt.abklingen, wav:null, fertig:null, gespeichert:null};
  Werkstatt.tonWeg = false;
  meldung(null);
  zeichnen();
  tonRechnen();
}

function tonPlanen(){
  clearTimeout(Werkstatt._takt);
  Werkstatt._takt = setTimeout(tonRechnen, 120);
}

// Rechnet den Ton neu. Laeuft ein Regler, kommen viele Auftraege
// hintereinander - nur der letzte zaehlt.
async function tonRechnen(){
  const T = Werkstatt.ton;
  if (!T) return;
  const nr = ++Werkstatt._rechnen;
  const rate = KOS.rate, dauer = T.ende - T.start;
  const n = Math.max(1, Math.round(dauer * rate));
  const ctx = new OfflineAudioContext(1, n, rate);
  const quelle = ctx.createBufferSource();
  quelle.buffer = T.quelle;
  const bass = ctx.createBiquadFilter();
  bass.type = "lowshelf"; bass.frequency.value = 140; bass.gain.value = T.bass;
  const vor = ctx.createGain();
  vor.gain.value = Math.pow(10, T.laut / 20) / VORHALT;
  const form = ctx.createWaveShaper();
  form.curve = saettigung(); form.oversample = "4x";
  const summe = ctx.createGain();
  quelle.connect(bass); bass.connect(vor); vor.connect(form); form.connect(summe);
  quelle.start(0, T.start, dauer);
  for (const art of ["knall", "pfeifen"]){
    const b = klassisch(art);
    if (T[art] <= 0 || !b) continue;
    const s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = b; g.gain.value = T[art] / 100;
    s.connect(g); g.connect(summe); s.start(0);
  }
  summe.connect(ctx.destination);
  let gerechnet;
  try{ gerechnet = await ctx.startRendering(); }catch(e){ return; }
  if (nr !== Werkstatt._rechnen || T !== Werkstatt.ton) return;    // ueberholt
  // Das eigene Abklingen, dann so leise, dass nichts abgeschnitten wird.
  const f = gerechnet.getChannelData(0), k = 5 * T.abklingen / 100;
  let spitze = 0;
  for (let i = 0; i < n; i++){
    f[i] *= Math.exp(-k * i / n);
    spitze = Math.max(spitze, Math.abs(f[i]));
  }
  const norm = spitze > 0.98 ? 0.98 / spitze : 1;
  const roh = new Int16Array(n);
  for (let i = 0; i < n; i++) roh[i] = Math.round(f[i] * norm * 32767);
  T.roh = roh;
  T.wav = wavSchreiben(roh, rate);
  T.fertig = tonAusklingen(roh, rate);
  tonMalen();
  statusMalen();
}

// ---- Wellen malen ---------------------------------------------------
function welleMalen(c, werte, von, bis, farbe, skala){
  const g = c.getContext("2d"), B = c.width, H = c.height;
  g.fillStyle = farbe;
  const je = Math.max(1, (bis - von) / B);
  for (let x = 0; x < B; x++){
    const a = Math.floor(von + x * je), e = Math.min(bis, Math.floor(von + (x + 1) * je) + 1);
    let lo = 0, hi = 0;
    for (let i = a; i < e; i++){ const v = werte[i] * skala; if (v < lo) lo = v; if (v > hi) hi = v; }
    const y0 = H / 2 - hi * H / 2, y1 = H / 2 - lo * H / 2;
    g.fillRect(x, y0, 1, Math.max(1, y1 - y0));
  }
}

function leinwand(c){
  // Die Leinwand rechnet in echten Pixeln, nicht in CSS-Pixeln: sonst
  // wird die Welle auf einem scharfen Bildschirm matschig.
  const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  const b = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
  if (c.width !== b || c.height !== h){ c.width = b; c.height = h; }
  const g = c.getContext("2d");
  g.clearRect(0, 0, b, h);
  return g;
}

function tonMalen(){
  const T = Werkstatt.ton, c = Werkstatt.dom.welle, e = Werkstatt.dom.ergebnis;
  if (c && c.isConnected && T){
    const g = leinwand(c), B = c.width, H = c.height;
    const kanal = T.quelle.getChannelData(0), dauer = T.quelle.duration;
    welleMalen(c, kanal, 0, kanal.length, DATEN.farben.matt_dunkel, 1);
    // Der gewaehlte Ausschnitt hell, mit zwei Griffen.
    const x0 = Math.round(T.start / dauer * B), x1 = Math.round(T.ende / dauer * B);
    g.save(); g.beginPath(); g.rect(x0, 0, x1 - x0, H); g.clip();
    welleMalen(c, kanal, 0, kanal.length, DATEN.farben.amber, 1);
    g.restore();
    g.fillStyle = "rgba(232,163,61,.10)"; g.fillRect(x0, 0, x1 - x0, H);
    g.fillStyle = DATEN.farben.creme;
    for (const x of [x0, x1]) g.fillRect(Math.min(B - 2, Math.max(0, x - 1)), 0, 2, H);
  }
  if (e && e.isConnected){
    const g = leinwand(e), B = e.width, H = e.height;
    const t = T ? T : null;
    if (t && t.fertig){
      // Dunkel, was gerechnet wurde; hell, was davon im Spiel klingt;
      // gestrichelt die Grenze, unter der es bleiben muss.
      welleMalen(e, t.roh, 0, t.roh.length, DATEN.farben.matt_dunkel, 1 / 32768);
      welleMalen(e, t.fertig.proben, 0, t.fertig.proben.length, DATEN.farben.amber, 1 / 32768);
      const f = t.fertig, n = f.proben.length, h = f.oben / 32768;
      const xa = Math.min(n, f.anlauf * f.breite) / n * B;
      g.strokeStyle = DATEN.farben.creme; g.setLineDash([4, 4]); g.lineWidth = 1;
      g.beginPath();
      g.moveTo(xa, H / 2 - h * H / 2); g.lineTo(B, H / 2);
      g.moveTo(xa, H / 2 + h * H / 2); g.lineTo(B, H / 2);
      g.stroke(); g.setLineDash([]);
    }else{
      const s = aktuellerTon();
      if (s) welleMalen(e, s.proben, 0, s.proben.length, DATEN.farben.amber, 1 / 32768);
    }
  }
  const z = Werkstatt.dom.tonText;
  if (z && z.isConnected && T){
    z.textContent = "START " + T.start.toFixed(2) + " S  ·  ENDE " + T.ende.toFixed(2) +
      " S  ·  LAENGE " + (T.ende - T.start).toFixed(2) + " S  (" + KOS.ton_min.toFixed(1) +
      " BIS " + KOS.ton_max.toFixed(1) + ")";
  }
}

// Zuschneiden mit der Maus: an einem Griff zieht man ihn, dazwischen
// verschiebt man den ganzen Ausschnitt. Laenger als erlaubt oder kuerzer
// geht nicht - der Griff bleibt einfach stehen.
function zuschneidenEinrichten(c){
  let zug = null;
  const zeit = (ev) => {
    const r = c.getBoundingClientRect();
    return Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * Werkstatt.ton.quelle.duration;
  };
  c.addEventListener("pointerdown", (ev) => {
    const T = Werkstatt.ton;
    if (!T) return;
    const t = zeit(ev), r = c.getBoundingClientRect();
    const fang = 8 / r.width * T.quelle.duration;
    if (Math.abs(t - T.start) <= fang) zug = {art:"start"};
    else if (Math.abs(t - T.ende) <= fang) zug = {art:"ende"};
    else if (t > T.start && t < T.ende) zug = {art:"mitte", ab:t - T.start};
    else zug = {art: t < T.start ? "start" : "ende"};
    c.setPointerCapture(ev.pointerId);
    bewegen(ev);
  });
  const bewegen = (ev) => {
    const T = Werkstatt.ton;
    if (!zug || !T) return;
    const t = zeit(ev), dauer = T.quelle.duration;
    if (zug.art === "start")
      T.start = Math.max(Math.max(0, T.ende - KOS.ton_max), Math.min(t, T.ende - KOS.ton_min));
    else if (zug.art === "ende")
      T.ende = Math.min(Math.min(dauer, T.start + KOS.ton_max), Math.max(t, T.start + KOS.ton_min));
    else{
      const laenge = T.ende - T.start;
      T.start = Math.max(0, Math.min(dauer - laenge, t - zug.ab));
      T.ende = T.start + laenge;
    }
    tonMalen();
    tonPlanen();
  };
  c.addEventListener("pointermove", bewegen);
  const los = () => { zug = null; };
  c.addEventListener("pointerup", los);
  c.addEventListener("pointercancel", los);
}

// ---- Bild ---------------------------------------------------------
// Seit 0.30 fuellt das Bild den ganzen Schirm, und man kann es auf dem
// Weiss verschieben und groesser oder kleiner machen (gemeldet). Wo es
// steht, kommt ins PNG selbst - als tEXt-Abschnitt "dustfront" mit
// {"x", "y", "h"}: Mitte und Hoehe als Anteil am Bildschirm. Genau so
// liest es spielerkosmetik.bild_lage. Kein Ausschnitt mehr: was ueber
// den Rand ragt, schneidet der Bildschirm ab.
function bildVorgaben(){
  return {rund:false, hell:0, kontrast:0, saett:0,
          farbton:0, stil:"normal", pixel:1, frittiert:0};
}

async function bildDatei(datei){
  if (!datei) return;
  if (datei.size > 40 * 1024 * 1024)
    return sageUndZeichne("DAS BILD IST ZU GROSS - HOECHSTENS 40 MB", "schlecht");
  const url = URL.createObjectURL(datei), img = new Image();
  try{
    await new Promise((ja, nein) => { img.onload = ja; img.onerror = nein; img.src = url; });
  }catch(e){
    URL.revokeObjectURL(url);
    return sageUndZeichne("DIESES BILD LAESST SICH NICHT LESEN", "schlecht");
  }
  bildUebernehmen(img, datei.name);
}

function bildUebernehmen(img, name){
  if (!img.naturalWidth || !img.naturalHeight)
    return sageUndZeichne("DIESES BILD IST LEER", "schlecht");
  const alt = Werkstatt.bild;
  // Wie beim Ton: die Filter bleiben. Die Lage nicht - ein anderes Bild
  // hat andere Seiten, und es soll erst einmal den Schirm fuellen.
  Werkstatt.bild = Object.assign(bildVorgaben(), alt || {},
    {quelle:img, name:String(name).toUpperCase(), lage:null,
     ausgabe:KOS.bild_max, flaeche:null, stand:0, gespeichert:-1});
  Werkstatt.bildWeg = false;
  meldung(null);
  zeichnen();
  bildRechnen();
}

// Fuellen: so gross, dass kein Weiss mehr zu sehen ist - dieselbe Rechnung
// wie in bild_lage, wenn das PNG keine Lage traegt.
function lageFuellen(b, h){
  const W = DATEN.spielbild.breite, H = DATEN.spielbild.hoehe;
  return {x:0.5, y:0.5, h:Math.max(W / b, H / h) * h / H};
}

function lageVon(B){
  return B.lage || lageFuellen(B.flaeche.width, B.flaeche.height);
}

// Ein Zufall mit festem Anfang: das Rauschen von FRITTIERT soll beim
// Schieben eines anderen Reglers nicht flimmern.
function zufall(saat){
  let s = saat >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Die Filter, von Hand auf die Pixel. ctx.filter waere kuerzer, kann
// aber nicht jeder Browser - und FRITTIERT kann keiner.
function filtern(p, breite, hoehe, B){
  const f = B.frittiert / 100;
  const hell = B.hell / 100 * 128;
  const C = Math.max(-254, Math.min(254, B.kontrast * 2.55 + 160 * f));
  const kf = (259 * (C + 255)) / (255 * (259 - C));
  const satt = Math.max(0, 1 + B.saett / 100 + 2.5 * f);
  const w = B.farbton * Math.PI / 180, co = Math.cos(w), si = Math.sin(w);
  // Farbton drehen: dieselbe Matrix wie hue-rotate in CSS.
  const m = [0.213 + co * 0.787 - si * 0.213, 0.715 - co * 0.715 - si * 0.715, 0.072 - co * 0.072 + si * 0.928,
             0.213 - co * 0.213 + si * 0.143, 0.715 + co * 0.285 + si * 0.140, 0.072 - co * 0.072 - si * 0.283,
             0.213 - co * 0.213 - si * 0.787, 0.715 - co * 0.715 + si * 0.715, 0.072 + co * 0.928 + si * 0.072];
  const stufen = Math.round(256 - 236 * f), q = 255 / Math.max(1, stufen - 1);
  const rnd = zufall(20251001);
  for (let i = 0; i < p.length; i += 4){
    let r = p[i], g = p[i + 1], b = p[i + 2];
    r += hell; g += hell; b += hell;
    r = (r - 128) * kf + 128; g = (g - 128) * kf + 128; b = (b - 128) * kf + 128;
    const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    r = l + (r - l) * satt; g = l + (g - l) * satt; b = l + (b - l) * satt;
    if (B.farbton){
      const r2 = m[0] * r + m[1] * g + m[2] * b, g2 = m[3] * r + m[4] * g + m[5] * b;
      b = m[6] * r + m[7] * g + m[8] * b; r = r2; g = g2;
    }
    if (B.stil === "grau"){
      r = g = b = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }else if (B.stil === "sepia"){
      const r2 = 0.393 * r + 0.769 * g + 0.189 * b, g2 = 0.349 * r + 0.686 * g + 0.168 * b;
      b = 0.272 * r + 0.534 * g + 0.131 * b; r = r2; g = g2;
    }else if (B.stil === "umgekehrt"){
      r = 255 - r; g = 255 - g; b = 255 - b;
    }
    if (f > 0){
      // Frittiert: zu warm, zu bunt, zu hart, verrauscht, in Stufen.
      const rausch = (rnd() - 0.5) * 90 * f;
      r += 46 * f + rausch; g += 8 * f + rausch; b += -46 * f + rausch;
      r = Math.round(r / q) * q; g = Math.round(g / q) * q; b = Math.round(b / q) * q;
    }
    p[i] = r; p[i + 1] = g; p[i + 2] = b;        // Uint8Clamped: rundet und kappt selbst
  }
  if (f > 0){
    // Nachschaerfen: der Unterschied zum Nachbarn mal 1 + 2f. Das macht
    // die Kanten, an denen man ein frittiertes Bild erkennt.
    const alt = new Uint8ClampedArray(p), staerke = 2 * f, zeile = breite * 4;
    for (let y = 1; y < hoehe - 1; y++){
      for (let x = 1; x < breite - 1; x++){
        const i = (y * breite + x) * 4;
        for (let k = 0; k < 3; k++){
          const um = alt[i - 4 + k] + alt[i + 4 + k] + alt[i - zeile + k] + alt[i + zeile + k];
          p[i + k] = alt[i + k] + staerke * (alt[i + k] - um / 4);
        }
      }
    }
  }
}

function bildRechnen(){
  const B = Werkstatt.bild;
  if (!B) return;
  // Das ganze Bild, die lange Seite hoechstens `ausgabe` Pixel. Kleiner
  // wird `ausgabe` nur, wenn das PNG sonst nicht durch die Grenze passt
  // (bildPng).
  const w = B.quelle.naturalWidth, h = B.quelle.naturalHeight;
  const m = Math.min(1, B.ausgabe / Math.max(w, h));
  const bw = Math.max(1, Math.round(w * m)), bh = Math.max(1, Math.round(h * m));
  const c = document.createElement("canvas");
  c.width = bw; c.height = bh;
  const g = c.getContext("2d", {willReadFrequently:true});
  const px = Math.max(1, Math.round(B.pixel));
  if (px > 1){
    const k = document.createElement("canvas");
    k.width = Math.max(1, Math.round(bw / px)); k.height = Math.max(1, Math.round(bh / px));
    const kg = k.getContext("2d");
    kg.imageSmoothingQuality = "high";
    kg.drawImage(B.quelle, 0, 0, k.width, k.height);
    g.imageSmoothingEnabled = false;
    g.drawImage(k, 0, 0, bw, bh);
  }else{
    g.imageSmoothingQuality = "high";
    g.drawImage(B.quelle, 0, 0, bw, bh);
  }
  const d = g.getImageData(0, 0, bw, bh);
  filtern(d.data, bw, bh, B);
  g.putImageData(d, 0, 0);
  if (B.rund){
    g.globalCompositeOperation = "destination-in";
    g.beginPath(); g.arc(bw / 2, bh / 2, Math.min(bw, bh) / 2, 0, Math.PI * 2); g.fill();
    g.globalCompositeOperation = "source-over";
  }
  B.flaeche = c;
  B.stand++;
  const r = Werkstatt.dom.groesseRegler;
  if (r && r.isConnected){
    const h = Math.round(lageVon(B).h * 100);
    r.eingabe.value = h; r.stand.textContent = h + " %";
  }
  bildMalen();
  statusMalen();
}

let _bildTakt = 0;
function bildPlanen(){
  if (_bildTakt) return;
  _bildTakt = requestAnimationFrame(() => { _bildTakt = 0; bildRechnen(); });
}

// ---- PNG mit Lage ---------------------------------------------------
let _crcTafel = null;
function crc32(bytes){
  if (!_crcTafel){
    _crcTafel = new Uint32Array(256);
    for (let n = 0; n < 256; n++){
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      _crcTafel[n] = c >>> 0;
    }
  }
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = _crcTafel[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// Den Abschnitt "dustfront" gleich hinter den Kopf (IHDR) setzen.
function pngMitLage(png, lage){
  const text = JSON.stringify({x:+lage.x.toFixed(4), y:+lage.y.toFixed(4), h:+lage.h.toFixed(4)});
  const inhalt = new TextEncoder().encode("dustfront\0" + text);
  const stueck = new Uint8Array(12 + inhalt.length);
  const d = new DataView(stueck.buffer);
  d.setUint32(0, inhalt.length);
  stueck.set([0x74, 0x45, 0x58, 0x74], 4);               // "tEXt"
  stueck.set(inhalt, 8);
  d.setUint32(8 + inhalt.length, crc32(stueck.subarray(4, 8 + inhalt.length)));
  const kopf = 8 + 25;                                  // Signatur + IHDR
  const aus = new Uint8Array(png.length + stueck.length);
  aus.set(png.subarray(0, kopf), 0);
  aus.set(stueck, kopf);
  aus.set(png.subarray(kopf), kopf + stueck.length);
  return aus;
}

// Die Lage aus einem PNG lesen, wie bild_lage im Spiel.
function pngLage(png, b, h){
  const lage = lageFuellen(b, h);
  try{
    const d = new DataView(png.buffer, png.byteOffset, png.byteLength);
    let o = 8;
    while (o + 12 <= png.length){
      const laenge = d.getUint32(o);
      const art = String.fromCharCode(png[o + 4], png[o + 5], png[o + 6], png[o + 7]);
      if (art === "IDAT" || o + 12 + laenge > png.length) break;
      if (art === "tEXt"){
        const inhalt = png.subarray(o + 8, o + 8 + laenge);
        const null_bei = inhalt.indexOf(0);
        if (new TextDecoder("latin1").decode(inhalt.subarray(0, null_bei)) === "dustfront"){
          const roh = JSON.parse(new TextDecoder("latin1").decode(inhalt.subarray(null_bei + 1)));
          const kappen = (v, [lo, hi]) => Math.max(lo, Math.min(hi, Number(v)));
          for (const [k, grenzen] of [["x", KOS.lage_xy], ["y", KOS.lage_xy], ["h", KOS.lage_h]])
            if (Number.isFinite(Number(roh[k]))) lage[k] = kappen(roh[k], grenzen);
          break;
        }
      }
      o += 12 + laenge;
    }
  }catch(e){ /* dann fuellt es eben */ }
  return lage;
}

// Das PNG zum Hochladen. Passt es nicht unter die Grenze des Spiels,
// wird das Bild kleiner gerechnet und noch einmal versucht - die Lage ist
// ein Anteil am Schirm und bleibt, wie sie ist.
async function bildPng(){
  const B = Werkstatt.bild;
  if (!B || !B.flaeche) return null;
  const lage = lageVon(B);
  for (const groesse of [KOS.bild_max, 256, 200, 160, 128, 96]){
    if (groesse > KOS.bild_max) continue;
    if (B.ausgabe !== groesse){ B.ausgabe = groesse; bildRechnen(); }
    const blob = await new Promise((ja) => B.flaeche.toBlob(ja, "image/png"));
    if (!blob) return null;
    const png = pngMitLage(new Uint8Array(await blob.arrayBuffer()), lage);
    if (png.length <= KOS.bild_bytes) return png;
  }
  return null;
}

function aktuellesBild(){
  const B = Werkstatt.bild;
  if (B && B.flaeche) return {flaeche:B.flaeche, lage:lageVon(B)};
  if (B || Werkstatt.bildWeg) return null;
  const S = Werkstatt.server;
  return S.bildFlaeche ? {flaeche:S.bildFlaeche, lage:S.bildLage} : null;
}

// Die kleine Vorschau neben den Reglern: das Bild allein, wie es gefiltert ist.
function bildMalen(){
  const c = Werkstatt.dom.zuschnitt;
  if (c && c.isConnected){
    const b = aktuellesBild();
    const g = c.getContext("2d");
    if (b){
      if (c.width !== b.flaeche.width || c.height !== b.flaeche.height){
        c.width = b.flaeche.width; c.height = b.flaeche.height;
      }
      g.clearRect(0, 0, c.width, c.height);
      g.drawImage(b.flaeche, 0, 0);
    }else{
      g.clearRect(0, 0, c.width, c.height);
    }
  }
  spielMalen(0.8);
}

// Auf der Vorschau im Spiel: ziehen verschiebt das Bild, das Mausrad
// macht es groesser oder kleiner. Nur fuer ein Bild in Arbeit - ein
// gespeichertes muesste man ohnehin neu hochladen.
function lageAendern(neu){
  const B = Werkstatt.bild;
  if (!B || !B.flaeche) return;
  const alt = lageVon(B);
  B.lage = {x:Math.max(KOS.lage_xy[0], Math.min(KOS.lage_xy[1], neu.x ?? alt.x)),
            y:Math.max(KOS.lage_xy[0], Math.min(KOS.lage_xy[1], neu.y ?? alt.y)),
            h:Math.max(KOS.lage_h[0], Math.min(KOS.lage_h[1], neu.h ?? alt.h))};
  B.stand++;
  const r = Werkstatt.dom.groesseRegler;
  if (r && r.isConnected){
    r.eingabe.value = Math.round(B.lage.h * 100);
    r.stand.textContent = Math.round(B.lage.h * 100) + " %";
  }
  spielMalen(0.8);
  statusMalen();
}

function lageEinrichten(c){
  let zug = null;
  c.addEventListener("pointerdown", (ev) => {
    if (!Werkstatt.bild) return;
    zug = {x:ev.clientX, y:ev.clientY};
    c.setPointerCapture(ev.pointerId);
    c.style.cursor = "grabbing";
  });
  c.addEventListener("pointermove", (ev) => {
    if (!zug || !Werkstatt.bild) return;
    const r = c.getBoundingClientRect(), alt = lageVon(Werkstatt.bild);
    lageAendern({x:alt.x + (ev.clientX - zug.x) / r.width,
                 y:alt.y + (ev.clientY - zug.y) / r.height});
    zug = {x:ev.clientX, y:ev.clientY};
  });
  const los = () => { zug = null; c.style.cursor = ""; };
  c.addEventListener("pointerup", los);
  c.addEventListener("pointercancel", los);
  c.addEventListener("wheel", (ev) => {
    if (!Werkstatt.bild) return;
    ev.preventDefault();
    lageAendern({h:lageVon(Werkstatt.bild).h * (ev.deltaY < 0 ? 1.08 : 1 / 1.08)});
  }, {passive:false});
}

// ---- So sieht es im Spiel aus ---------------------------------------
// Dieselbe Flaeche wie das Spiel (640 x 360), dasselbe Weiss, dasselbe
// Bild an derselben Stelle mit derselben Deckkraft wie in
// spielerkosmetik._kosmetik_bild_zeichnen und render.blendung_zeichnen.
function spielMalen(blend){
  const c = Werkstatt.dom.spiel;
  if (!c || !c.isConnected) return;
  const W = DATEN.spielbild.breite, H = DATEN.spielbild.hoehe;
  if (c.width !== W){ c.width = W; c.height = H; }
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  // Ein Stueck Boden, damit man das Weiss als Weiss sieht.
  for (let y = 0; y < H; y += 32)
    for (let x = 0; x < W; x += 32){
      g.fillStyle = ((x + y) / 32) % 2 ? "#2a2018" : "#241b14";
      g.fillRect(x, y, 32, 32);
    }
  const figur = Werkstatt.dom.figur;
  if (figur && figur.complete) g.drawImage(figur, W / 2 - figur.width, H / 2 - figur.height,
                                           figur.width * 2, figur.height * 2);
  if (blend <= 0.01) return;
  g.fillStyle = "rgba(255,255,255," + (DATEN.blenden.weiss *
    Math.min(1, blend / Math.max(0.01, DATEN.blenden.deckend_ab))) + ")";
  g.fillRect(0, 0, W, H);
  const b = aktuellesBild();
  if (b){
    const bh = Math.max(1, Math.round(b.lage.h * H));
    const bw = Math.max(1, Math.round(b.flaeche.width * bh / b.flaeche.height));
    g.imageSmoothingEnabled = true;             // im Spiel: smoothscale
    g.globalAlpha = Math.min(1, blend * 1.4);
    g.drawImage(b.flaeche, Math.round(b.lage.x * W - bw / 2),
                Math.round(b.lage.y * H - bh / 2), bw, bh);
    g.globalAlpha = 1;
  }
}

// Ein Blitz von vorn: Ton ab, und das Weiss klingt ab wie im Spiel
// (render.Befinden: Rest hoch 1 durch abklingen).
function blitzZeigen(){
  const t = aktuellerTon();
  if (t) tonSpielen(t);
  const ab = performance.now(), dauer = DATEN.blenden.dauer * 1000;
  const nr = ++Werkstatt._blitz;
  const schritt = (jetzt) => {
    if (nr !== Werkstatt._blitz) return;
    const rest = Math.max(0, 1 - (jetzt - ab) / dauer);
    spielMalen(Math.pow(rest, 1 / DATEN.blenden.abklingen));
    if (rest > 0) requestAnimationFrame(schritt);
    else spielMalen(0.8);
  };
  requestAnimationFrame(schritt);
}

// ---- Der Server -----------------------------------------------------
// Jeder Aufruf mit einer abgelaufenen Anmeldung wird einmal erneuert
// und wiederholt - die Kosmetik bastelt man laenger als eine Stunde.
async function mitSitzung(tun){
  let a = await tun(Stand.sitzung.marke);
  if (!a.ok && /JWT|TOKEN/.test(a.fehler) && Stand.sitzung.erneuern){
    const e = await Netz.erneuern(Stand.sitzung.erneuern);
    if (e.ok){
      Stand.sitzung = Object.assign({}, Stand.sitzung, e.daten);
      Stand.sichern();
      a = await tun(Stand.sitzung.marke);
    }
  }
  return a;
}

function kosmetikFehler(f){
  const t = String(f || "");
  if (/KOSMETIK/.test(t) && /(SCHEMA CACHE|DOES NOT EXIST|COULD NOT FIND)/.test(t))
    return "AUF DEM SERVER FEHLT DIE TABELLE KOSMETIK. WER DEN SERVER BETREUT, " +
           "LEGT SIE EINMAL AN - SIEHE docs/KONTO.md, ABSCHNITT 5.6.";
  if (/GROESSE|CHECK CONSTRAINT/.test(t)) return "ZU GROSS FUER DEN SERVER";
  return t;
}

// Was gespeichert ist, aufbereitet wie im Spiel: der Ton durch die
// Grenze, das Bild als Leinwand.
async function serverAufbereiten(){
  const S = Werkstatt.server;
  S.tonFertig = null; S.bildFlaeche = null; S.bildLage = null;
  if (S.ton){
    const w = wavLesen(ausBase64(S.ton));
    if (w) S.tonFertig = {proben:tonAusklingen(w.proben, w.rate).proben, rate:w.rate};
  }
  if (S.bild){
    const img = new Image();
    try{
      await new Promise((ja, nein) => { img.onload = ja; img.onerror = nein;
                                         img.src = "data:image/png;base64," + S.bild; });
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext("2d").drawImage(img, 0, 0);
      S.bildFlaeche = c;
      S.bildLage = pngLage(ausBase64(S.bild), c.width, c.height);
    }catch(e){ S.bildFlaeche = null; }
  }
}

async function kosmetikLaden(){
  const S = Werkstatt.server;
  if (S.laedt) return;
  S.laedt = true;
  const a = await mitSitzung((m) => Netz.kosmetikLesen(m));
  S.laedt = false;
  S.geladen = true;
  if (!a.ok){ S.fehler = kosmetikFehler(a.fehler); zeichnen(); return; }
  S.fehler = ""; S.ton = a.daten.ton; S.bild = a.daten.bild;
  await serverAufbereiten();
  zeichnen();
}

async function kosmetikSpeichern(){
  const W = Werkstatt, S = W.server;
  let ton = W.tonWeg ? "" : S.ton, bild = W.bildWeg ? "" : S.bild;
  if (W.ton){
    if (!W.ton.wav) return sageUndZeichne("DER TON WIRD NOCH GERECHNET - GLEICH NOCH EINMAL", "schlecht");
    if (W.ton.wav.length > KOS.ton_bytes) return sageUndZeichne("DER TON IST ZU GROSS", "schlecht");
    ton = zuBase64(W.ton.wav);
  }
  if (W.bild){
    const png = await bildPng();
    if (!png) return sageUndZeichne("DAS BILD LIESS SICH NICHT SPEICHERN", "schlecht");
    if (png.length > KOS.bild_bytes)
      return sageUndZeichne("DAS BILD IST ZU GROSS - WENIGER FRITTIERT ODER MEHR PIXEL", "schlecht");
    bild = zuBase64(png);
  }
  sageUndZeichne("SPEICHERE...", "arbeit");
  const kennung = Stand.sitzung.kennung;
  const a = (ton || bild)
    ? await mitSitzung((m) => Netz.kosmetikSchreiben(m, kennung, ton, bild))
    : await mitSitzung((m) => Netz.kosmetikLoeschen(m, kennung));
  if (!a.ok) return sageUndZeichne(kosmetikFehler(a.fehler), "schlecht");
  S.ton = ton; S.bild = bild; S.fehler = "";
  W.tonWeg = W.bildWeg = false;
  if (W.ton) W.ton.gespeichert = W.ton.wav;
  if (W.bild) W.bild.gespeichert = W.bild.stand;
  await serverAufbereiten();
  sageUndZeichne(ton || bild
    ? "GESPEICHERT - IM SPIEL AB DER NAECHSTEN LOBBY"
    : "ENTFERNT - DEINE BLENDGRANATE KNALLT WIEDER WIE IMMER", "gut");
}

// ---- Die Seite ------------------------------------------------------
function regler(name, min, max, schritt, wert, text, aendern){
  const z = el("div", "regler");
  const r = el("input");
  r.type = "range"; r.min = min; r.max = max; r.step = schritt; r.value = wert;
  r.setAttribute("aria-label", name);
  const s = el("span", "stand", text(Number(wert)));
  r.addEventListener("input", () => { const v = Number(r.value); s.textContent = text(v); aendern(v); });
  anhaengen(z, el("label", null, name), r, s);
  z.eingabe = r; z.stand = s;
  return z;
}

function dateiKnopf(text, annehmen, tun){
  const i = el("input");
  i.type = "file"; i.accept = annehmen;
  i.className = "verborgen";
  i.addEventListener("change", () => { const d = i.files && i.files[0]; i.value = ""; tun(d); });
  const b = knopf(text, null, () => i.click());
  b.datei = i;
  const h = el("span");
  anhaengen(h, b, i);
  return h;
}

function statusText(art){
  const W = Werkstatt, S = W.server;
  if (art === "ton"){
    if (W.ton) return W.ton.gespeichert && W.ton.gespeichert === W.ton.wav
      ? ["GESPEICHERT  ·  " + W.ton.name, "blau"]
      : ["IN ARBEIT  ·  " + W.ton.name + "  ·  NOCH NICHT GESPEICHERT", "amber"];
    if (W.tonWeg) return ["WIRD BEIM SPEICHERN ENTFERNT", "rot"];
    if (S.tonFertig) return ["GESPEICHERT  ·  " + (S.tonFertig.proben.length / S.tonFertig.rate).toFixed(2) + " S", "blau"];
    return ["NOCH KEINER - DEINE BLENDGRANATE KNALLT WIE IMMER", "matt"];
  }
  if (W.bild) return W.bild.gespeichert === W.bild.stand
    ? ["GESPEICHERT  ·  " + W.bild.name, "blau"]
    : ["IN ARBEIT  ·  " + W.bild.name + "  ·  NOCH NICHT GESPEICHERT", "amber"];
  if (W.bildWeg) return ["WIRD BEIM SPEICHERN ENTFERNT", "rot"];
  if (S.bildFlaeche) return ["GESPEICHERT", "blau"];
  return ["NOCH KEINS - IM WEISS STEHT NICHTS", "matt"];
}

function statusMalen(){
  for (const art of ["ton", "bild"]){

    if (!z || !z.isConnected) continue;
    const [text, farbe] = statusText(art);
    z.textContent = text; z.className = "status " + farbe;
  }
}

function seiteKosmetik(ziel){

    "<b class='creme'>ohne Kosmetik</b> - mit erst, wenn jeder alles hat. " +

  gitter.appendChild(t);

  // ---- Bild
  const b = el("div", "tafel kante");
  b.style.marginBottom = "0";
  const bk = el("div"); bk.style.marginBottom = "4px";
  bk.appendChild(Schrift.malen("BILD", 2, DATEN.farben.amber));
  b.appendChild(bk);
  W.dom.bildStatus = el("div", "status");
  b.appendChild(W.dom.bildStatus);
  b.appendChild(dateiKnopf("DATEI WAEHLEN", "image/*", bildDatei));
  const z = el("canvas", "zuschnitt abstand");
  z.title = "Das Bild mit seinen Filtern. Verschoben wird es unten im Weiss.";
  W.dom.zuschnitt = z;
  b.appendChild(z);
  const B = W.bild;
  if (B){
    const neu = (feld) => (v) => { B[feld] = v; bildPlanen(); };
    const zahl = (v) => (v > 0 ? "+" : "") + v;
    const h0 = B.flaeche ? lageVon(B).h : 1;
    W.dom.groesseRegler = regler("GROESSE", Math.round(KOS.lage_h[0] * 100),
      Math.round(KOS.lage_h[1] * 100), 1, Math.round(h0 * 100), (v) => v + " %",
      (v) => lageAendern({h:v / 100}));
    W.dom.groesseRegler.title = "Hoehe des Bildes im Verhaeltnis zum Bildschirm";
    const stil = el("select");
    for (const [wert, name] of [["normal","NORMAL"],["grau","GRAU"],["sepia","SEPIA"],["umgekehrt","UMGEKEHRT"]]){
      const o = el("option", null, name); o.value = wert;
      if (B.stil === wert) o.selected = true;
      stil.appendChild(o);
    }
    stil.addEventListener("change", () => { B.stil = stil.value; bildPlanen(); });
    const stilZeile = el("div", "regler");
    anhaengen(stilZeile, el("label", null, "STIL"), stil, el("span"));
    const rund = el("label", "klein");
    rund.style.margin = "6px 0 0";
    const haken = el("input"); haken.type = "checkbox"; haken.checked = B.rund;
    haken.addEventListener("change", () => { B.rund = haken.checked; bildPlanen(); });
    anhaengen(rund, haken, document.createTextNode("RUND AUSSCHNEIDEN"));
    anhaengen(b, el("div", "abstand"),
      W.dom.groesseRegler,
      regler("HELLIGKEIT", -100, 100, 1, B.hell, zahl, neu("hell")),
      regler("KONTRAST", -100, 100, 1, B.kontrast, zahl, neu("kontrast")),
      regler("FARBE", -100, 200, 1, B.saett, zahl, neu("saett")),
      regler("FARBTON", 0, 359, 1, B.farbton, (v) => v + "°", neu("farbton")),
      regler("PIXEL", 1, 16, 1, B.pixel, (v) => v === 1 ? "AUS" : v + " PX", neu("pixel")),
      regler("FRITTIERT", 0, 100, 1, B.frittiert, (v) => v + " %", neu("frittiert")),
      stilZeile, rund);
    b.lastChild.previousSibling.style.marginTop = "6px";
  }
  const bz = el("div", "zeile abstand");
  anhaengen(bz,
    B ? knopf("FUELLEN", null, () => { B.lage = null; B.stand++; zeichnen(); bildMalen(); }) : null,
    B ? knopf("MITTE", null, () => lageAendern({x:0.5, y:0.5})) : null,
    B ? knopf("FILTER ZURUECK", null, () => {
          const v = bildVorgaben();
          for (const k of ["hell","kontrast","saett","farbton","stil","pixel","frittiert","rund"]) B[k] = v[k];
          zeichnen(); bildRechnen(); }) : null,
    (B || W.server.bild) && !W.bildWeg
      ? knopf("BILD ENTFERNEN", null, () => {
          W.bild = null; W.bildWeg = !!W.server.bild; zeichnen(); })
      : null);
  b.appendChild(bz);
  gitter.appendChild(b);
  ziel.appendChild(gitter);

  // ---- Im Spiel
  const s = tafel("SO SIEHT ES IM SPIEL AUS");
  s.appendChild(el("div", "klein matt",
    "Dieselbe Flaeche wie im Spiel, dasselbe Weiss, dasselbe Abklingen. " +
    "Ohne weiteres fuellt das Bild den ganzen Schirm. Mit der Maus ziehen verschiebt es, " +
    "das Mausrad (oder GROESSE) macht es groesser oder kleiner; was ueber den Rand ragt, " +
    "ist abgeschnitten. FUELLEN setzt es zurueck."));
  const sc = el("canvas", "spielbild abstand");
  W.dom.spiel = sc;
  lageEinrichten(sc);
  if (W.bild) sc.style.cursor = "grab";
  const figur = new Image();
  figur.onload = () => spielMalen(0.8);
  figur.src = DATEN.figur;
  W.dom.figur = figur;
  s.appendChild(sc);
  const sz = el("div", "zeile abstand");
  const speichern = knopf("SPEICHERN", "stark", kosmetikSpeichern);
  if (W.server.laedt || !W.server.geladen) speichern.disabled = true;
  anhaengen(sz, knopf("BLITZ!", null, blitzZeigen), speichern);
  s.appendChild(sz);
  ziel.appendChild(s);

  // Gemalt wird, wenn die Leinwaende im Dokument stehen und ihre Groesse
  // kennen - also nach dem Einhaengen.
  requestAnimationFrame(() => { tonMalen(); bildMalen(); statusMalen(); });
}

// ---- Konto --------------------------------------------------------
function seiteKonto(ziel){
  const t = tafel("KONTO");
  const namensfeld = feld("ANZEIGENAME", "text", Stand.profil.name || Stand.sitzung.name,
    {maxLength: DATEN.namenslaenge});
  t.appendChild(namensfeld);
  t.appendChild(el("div", "klein matt",
    "Der Anzeigename steht auf der Siegtafel. Angemeldet wird weiter mit " +
    "dem Namen, mit dem das Konto angelegt wurde - der laesst sich nicht " +
    "aendern, denn an ihm haengen alle Runden."));
  const r1 = el("div");
  r1.style.margin = "12px 0 22px";
  r1.appendChild(knopf("NAMEN SPEICHERN", "stark", () => {
    Stand.profil.name = namensfeld.eingabe.value.trim().toUpperCase();
    sichernProfil();
  }));
  t.appendChild(r1);

  const neu = feld("NEUES KENNWORT", "password", "", {autocomplete:"new-password"});
  const nochmal = feld("NOCH EINMAL", "password", "", {autocomplete:"new-password"});
  anhaengen(t, neu, nochmal);
  const r2 = el("div");
  r2.appendChild(knopf("KENNWORT AENDERN", null, async () => {
    const a = neu.eingabe.value, b = nochmal.eingabe.value;
    if (a.length < 8) return sageUndZeichne("KENNWORT ZU KURZ - MINDESTENS 8 ZEICHEN", "schlecht");
    if (a !== b) return sageUndZeichne("DIE BEIDEN KENNWOERTER SIND NICHT GLEICH", "schlecht");
    meldung("AENDERE...", "arbeit"); zeichnen();
    const antwort = await Netz.kennwortAendern(Stand.sitzung.marke, a);
    sageUndZeichne(antwort.ok ? "KENNWORT GEAENDERT" : antwort.fehler,
      antwort.ok ? "gut" : "schlecht");
  }));
  t.appendChild(r2);
  ziel.appendChild(t);

  const t2 = tafel("ZUGANG");
  const tab = el("table");
  for (const [k, v] of [
    ["KENNUNG", Stand.sitzung.kennung],
    ["SERVER", Netz.url],
    ["FASSUNG DES PROFILS", String(Stand.profil.fassung)],
    ["RUNDEN AUF DEM SERVER", String(Stand.gefechte.length)],
  ]){
    const r = el("tr");
    anhaengen(r, el("td", "matt", k), el("td", "rechts mono klein", v));
    tab.appendChild(r);
  }
  t2.appendChild(tab);
  const r3 = el("div");
  r3.style.marginTop = "14px";
  anhaengen(r3, knopf("NEU LADEN", null, () => { Stand.entwurf = null; ladenUndZeichnen(true); }),
    knopf("ABMELDEN", null, () => Stand.abmelden()));
  r3.lastChild.style.marginLeft = "8px";
  t2.appendChild(r3);
  t2.appendChild(el("div", "klein matt",
    "Ein Konto ganz zu loeschen geht von hier aus nicht: dazu braucht es " +
    "den geheimen Schluessel des Projekts, und der darf in keiner Datei " +
    "stehen, die jemand herunterladen kann. Wer sein Konto weghaben will, " +
    "sagt es dem, der den Server betreut."));
  ziel.appendChild(t2);
}

// ══════════════════════════════════════════════════════════════════
// Ablauf
// ══════════════════════════════════════════════════════════════════
function sageUndZeichne(text, art){ meldung(text, art); zeichnen(); }

async function sichernProfil(){
  meldung("SPEICHERE...", "arbeit"); zeichnen();
  const antwort = await Netz.profilSchreiben(Stand.sitzung.marke, Stand.profil);
  if (antwort.ok){
    Stand.profil = antwort.daten;
    sageUndZeichne("GESPEICHERT", "gut");
  }else{
    // Die Fassung hat nicht mehr gestimmt: frisch lesen, damit der
    // naechste Versuch auf dem steht, was wirklich da ist. Ein Entwurf
    // der Loadouts bleibt dabei stehen - er ist ja noch nicht verloren.
    await ladenUndZeichnen(true);
    sageUndZeichne(antwort.fehler, "schlecht");
  }
  return antwort.ok;
}

async function ladenUndZeichnen(still){
  if (!still){ meldung("LADE...", "arbeit"); zeichnen(); }
  const p = await Netz.profilLesen(Stand.sitzung.marke);
  if (!p.ok){
    // Abgelaufene Sitzung: einmal erneuern, sonst hinaus.
    if (Stand.sitzung.erneuern){
      const e = await Netz.erneuern(Stand.sitzung.erneuern);
      if (e.ok){
        Stand.sitzung = Object.assign({}, Stand.sitzung, e.daten);
        Stand.sichern();
        return ladenUndZeichnen(true);
      }
    }
    Stand.abmelden();
    return sageUndZeichne("DIE ANMELDUNG IST ABGELAUFEN", "schlecht");
  }
  Stand.profil = p.daten;
  const g = await Netz.gefechteLesen(Stand.sitzung.marke);
  Stand.gefechte = g.ok ? g.daten : [];
  if (!still) meldung(null);
  zeichnen();
}

function zeichnen(){
  const r = document.getElementById("rahmen");
  r.textContent = "";
  if (!Stand.sitzung) return zeichneTor(r);

  const kopf = el("div", "kopf");
  const links = el("div");
  anhaengen(links, ueberschrift("DUSTFRONT", 4),
    el("div", "unter", "KONTO  ·  VERSION " + DATEN.version + "  ·  " + DATEN.phase));
  kopf.appendChild(links);
  const wer = el("div", "wer");
  wer.style.display = "flex";
  wer.style.alignItems = "center";
  wer.style.gap = "10px";
  const kachel = el("div", "kasten kante");
  kachel.style.padding = "5px";
  kachel.style.lineHeight = "0";
  const bild = el("img");
  bild.src = DATEN.figur; bild.alt = "";
  bild.style.imageRendering = "pixelated";
  bild.style.height = "42px";
  kachel.appendChild(bild);
  const text = el("div");
  anhaengen(text,
    el("div", "creme", (Stand.profil && Stand.profil.name) || Stand.sitzung.name),
    el("div", "klein dunkel", "ANGEMELDET"));
  anhaengen(wer, kachel, text);
  kopf.appendChild(wer);
  r.appendChild(kopf);

  const leiste = el("div", "leiste");
  for (const s of SEITEN){
    const b = el("button", "reiter kante", s.name.replace(/UE/g, "Ü"));
    b.setAttribute("aria-selected", String(s.name === Stand.seite));
    if (!s.frei){ b.disabled = true; b.title = s.hinweis || ""; }
    else b.addEventListener("click", () => { Stand.seite = s.name; meldung(null); zeichnen(); });
    leiste.appendChild(b);
  }
  r.appendChild(leiste);

  if (Stand.meldung){
    r.appendChild(el("div", "meldung kante " + Stand.meldung.art, Stand.meldung.text));
  }

  if (!Stand.profil){
    r.appendChild(el("div", "meldung kante arbeit", "LADE..."));
  }else{
    const s = SEITEN.find(x => x.name === Stand.seite) || SEITEN[0];
    const inhalt = el("div");
    try{ s.bauen(inhalt); }
    catch(e){ inhalt.appendChild(el("div", "meldung kante schlecht",
      "DIESE SEITE HAT EINEN FEHLER: " + e.message)); }
    r.appendChild(inhalt);
  }

  r.appendChild(el("div", "fuss",
    "DUSTFRONT " + DATEN.version + " · Diese Seite liegt auf deinem Rechner " +
    "und redet nur mit dem Spielserver. Erzeugt aus werkzeug_kontoseite.py."));
}

function zeichneTor(ziel){
  const tor = el("div", "tor");
  const t = el("div", "tafel kante");
  const kopf = el("div", "mitte");
  kopf.style.marginBottom = "4px";
  kopf.appendChild(Schrift.malen("DUSTFRONT", 4, DATEN.farben.amber));
  kopf.firstChild.style.margin = "0 auto";
  t.appendChild(kopf);
  t.appendChild(el("div", "unter mitte", "KONTO"));

  if (!Netz.eingerichtet){
    t.appendChild(el("div", "meldung kante schlecht",
      "In dieser Datei steht kein Server. Sie wurde erzeugt, bevor einer " +
      "eingetragen war - neu erzeugen mit werkzeug_kontoseite.py."));
    ziel.appendChild(anhaengen(tor, t));
    return;
  }

  const name = feld("NAME", "text", "", {autocomplete:"username",
    maxLength: DATEN.namenslaenge});
  const wort = feld("KENNWORT", "password", "", {autocomplete:"current-password"});
  name.style.marginTop = "18px";
  anhaengen(t, name, wort);

  if (Stand.meldung) t.appendChild(el("div", "meldung kante " + Stand.meldung.art,
    Stand.meldung.text));

  const tun = async (anlegen) => {
    const n = name.eingabe.value.trim(), w = wort.eingabe.value;
    if (!n) return sageUndZeichne("NAME FEHLT", "schlecht");
    if (w.length < 8) return sageUndZeichne("KENNWORT ZU KURZ - MINDESTENS 8 ZEICHEN", "schlecht");
    meldung(anlegen ? "LEGE AN..." : "MELDE AN...", "arbeit"); zeichnen();
    const a = anlegen ? await Netz.anlegen(n, w) : await Netz.anmelden(n, w);
    if (!a.ok) return sageUndZeichne(a.fehler, "schlecht");
    Stand.sitzung = a.daten; Stand.sichern(); meldung(null);
    await ladenUndZeichnen(true);
  };

  const reihe = el("div");
  reihe.style.display = "flex"; reihe.style.gap = "8px"; reihe.style.marginTop = "6px";
  const anmelden = knopf("ANMELDEN", "stark", () => tun(false));
  anmelden.style.flex = "1";
  const neu = knopf("NEU", null, () => tun(true));
  anhaengen(reihe, anmelden, neu);
  t.appendChild(reihe);

  for (const f of [name, wort])
    f.eingabe.addEventListener("keydown", (e) => { if (e.key === "Enter") tun(false); });

  t.appendChild(el("div", "klein matt",
    "Dasselbe Konto wie im Spiel. Es gibt keine Adresse zum Zuruecksetzen - " +
    "wer sein Kennwort vergisst, legt ein neues Konto an oder fragt den, " +
    "der den Server betreut."));
  tor.appendChild(t);
  ziel.appendChild(tor);
  setTimeout(() => name.eingabe.focus(), 0);
}

// ---- Los ----------------------------------------------------------
werkstattLeeren();
Stand.laden();
zeichnen();
if (Stand.sitzung) ladenUndZeichnen(false);
</script>
</body>
</html>
